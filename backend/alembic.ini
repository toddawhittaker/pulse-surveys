# Alembic configuration — ticket E0-04, SPEC §13.
#
# **There is no `sqlalchemy.url` here, and that is the point.** Migrations run
# as the bootstrap superuser identity and the application runs as a role that
# deliberately cannot create a table (docs/adr/0009), so the connection Alembic
# needs is not the one `DATABASE_URL` names. `migrations/env.py` assembles it —
# the address from `DATABASE_URL`, the identity from `DB_SUPERUSER` and
# `DB_SUPERUSER_PASSWORD` — and builds the engine itself. See
# docs/adr/0012-the-migration-environment-builds-its-own-superuser-connection.md.
#
# Keeping the URL out of this file also keeps a password out of a file that is
# committed, out of `configparser` interpolation (where a `%` in a password is a
# syntax error), and out of anything that dumps the configuration.

[alembic]
# `%(here)s` is this file's own directory, so the script directory resolves the
# same whether alembic is run from `backend/` (`make migrate`, the CI drift
# gate) or from the repository root (pytest). A bare relative path would resolve
# against the working directory and fail on where the caller happens to stand.
script_location = %(here)s/migrations

# Date first, so `ls versions/` is in the order the chain applies. The revision
# hash follows it, because that is what `down_revision` names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# `backend/`, this file's directory, on `sys.path` — so `import app` resolves
# even in a checkout where the package has not been installed editable.
prepend_sys_path = %(here)s

# Explicit rather than left to the legacy fallback, which splits on spaces and
# commas and warns about it.
path_separator = os

# Logging. `env.py` applies this with `disable_existing_loggers=False`; see the
# comment there for why that flag is not cosmetic.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
