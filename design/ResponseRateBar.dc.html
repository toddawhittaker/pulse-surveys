<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}</style></helmet>
<div style="font-family:var(--font-body)" role="img" aria-label="{{ ariaLabel }}">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
    <span style="font-size:var(--text-1);font-weight:500;color:var(--spruce-60)">{{ label }}</span>
    <span style="font-family:var(--font-mono);font-size:var(--text-1);color:var(--spruce);font-variant-numeric:tabular-nums">{{ readout }}</span>
  </div>
  <div style="height:6px;background:var(--chalk);border:1px solid var(--hairline);border-radius:3px;overflow:hidden">
    <div style="height:100%;width:{{ pctW }};background:var(--spruce);border-radius:3px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:672,&quot;height&quot;:60},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Response rate&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;num&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:18,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:500},&quot;den&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:500}}">
class Component extends DCLogic {
  renderVals() {
    const num = this.props.num ?? 18, den = this.props.den ?? 24;
    const pct = den ? Math.round(num / den * 100) : 0;
    const label = this.props.label ?? 'Response rate';
    return {
      label,
      readout: num + ' / ' + den + ' · ' + pct + '%',
      pctW: pct + '%',
      ariaLabel: label + ': ' + num + ' of ' + den + ', ' + pct + ' percent.'
    };
  }
}
</script>
</body>
</html>
