<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}</style></helmet>
<div style="font-family:var(--font-body)">
  <div style="font-size:var(--text-1);font-weight:500;color:var(--spruce-60);margin-bottom:var(--space-1)">{{ label }}</div>
  <div style="font-family:var(--font-mono);font-size:var(--text-4);font-weight:500;color:var(--spruce);line-height:1.1;font-variant-numeric:tabular-nums">{{ value }}<span style="font-size:var(--text-2);color:var(--spruce-60)"> {{ unit }}</span></div>
  <sc-if value="{{ hasCompare }}" hint-placeholder-val="{{ true }}"><div style="font-family:var(--font-mono);font-size:var(--text-1);color:var(--spruce-60);margin-top:6px">{{ compare }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:110},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Median hours this week&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6.5&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;h&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compare&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;vs 5.0 h comparable · 4.8 h university&quot;,&quot;tsType&quot;:&quot;string&quot;}}">class Component extends DCLogic {
  renderVals() {
    const compare = this.props.compare ?? '';
    return {
      label: this.props.label ?? '',
      value: this.props.value ?? '',
      unit: this.props.unit ?? '',
      compare,
      hasCompare: compare.trim().length > 0
    };
  }
}</script>
</body>
</html>
