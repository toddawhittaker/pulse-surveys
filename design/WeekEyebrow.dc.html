<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}</style></helmet>
<div style="font-family:var(--font-mono);font-size:var(--text-1);font-weight:400;letter-spacing:0.08em;color:var(--spruce-60);text-transform:uppercase;white-space:nowrap">WK {{ weekPad }} / {{ totalPad }}<sc-if value="{{ hasNote }}" hint-placeholder-val="{{ true }}"><span> · {{ note }}</span></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:48},&quot;week&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:20},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:20},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;closes Sun 11:59 PM&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = (n) => String(n ?? 0).padStart(2, '0');
    const note = this.props.note ?? 'closes Sun 11:59 PM';
    return {
      weekPad: p(this.props.week ?? 7),
      totalPad: p(this.props.total ?? 12),
      note,
      hasNote: !!note
    };
  }
}
</script>
</body>
</html>
