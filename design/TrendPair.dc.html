<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}</style></helmet>
<div style="font-family:var(--font-body)">
  <div style="font-family:var(--font-mono);font-size:var(--text-1);letter-spacing:0.08em;text-transform:uppercase;color:var(--spruce-60);margin-bottom:var(--space-2)">Instructor</div>
  <dc-import name="PulseTrendChart" section="{{ instrSection }}" benchmark="{{ instrBenchmark }}" university="{{ instrUniversity }}" comparables="{{ comp }}" cohorts="{{ instrCohorts }}" axis="{{ axis }}" show-legend="{{ false }}" show-ticks="{{ false }}" height="{{ 190 }}" y-min="{{ 1 }}" y-max="{{ 5 }}" draw-delay="{{ 0 }}" fade-delay="{{ 1200 }}" total-weeks="{{ totalWeeks }}" hint-size="100%,190px"></dc-import>
  <div style="font-family:var(--font-mono);font-size:var(--text-1);letter-spacing:0.08em;text-transform:uppercase;color:var(--spruce-60);margin:var(--space-4) 0 var(--space-2)">Course</div>
  <dc-import name="PulseTrendChart" section="{{ courseSection }}" benchmark="{{ courseBenchmark }}" university="{{ courseUniversity }}" comparables="{{ comp }}" cohorts="{{ courseCohorts }}" axis="{{ axis }}" show-legend="{{ showLegend }}" show-ticks="{{ true }}" term-offset="{{ termOffset }}" comp-label="{{ compLabel }}" height="{{ 190 }}" y-min="{{ 1 }}" y-max="{{ 5 }}" draw-delay="{{ 600 }}" fade-delay="{{ 1200 }}" total-weeks="{{ totalWeeks }}" hint-size="100%,230px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:440},&quot;instrSection&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;courseSection&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;instrBenchmark&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;courseBenchmark&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;instrUniversity&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;courseUniversity&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;comparables&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;totalWeeks&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:20}}">
class Component extends DCLogic {
  renderVals() {
    const comp = this.props.comparables ?? true;
    const hasCohorts = !!this.props.instrCohorts;
    return {
      comp,
      instrCohorts: this.props.instrCohorts ?? null,
      courseCohorts: this.props.courseCohorts ?? null,
      axis: this.props.axis ?? 'course',
      showLegend: comp && !hasCohorts,
      termOffset: this.props.termOffset ?? null,
      compLabel: this.props.compLabel ?? 'Comparable courses',
      totalWeeks: this.props.totalWeeks ?? 12,
      instrSection: this.props.instrSection ?? [3.9, 3.9, 3.8, 4.0, 3.8, 3.6, 3.6],
      courseSection: this.props.courseSection ?? [3.8, 3.7, 3.6, 3.9, 3.5, 3.3, 3.4],
      instrBenchmark: this.props.instrBenchmark ?? [3.9, 3.9, 3.8, 3.9, 3.9, 3.8, 3.9],
      courseBenchmark: this.props.courseBenchmark ?? [3.8, 3.8, 3.7, 3.8, 3.8, 3.7, 3.8],
      instrUniversity: this.props.instrUniversity ?? [3.8, 3.8, 3.7, 3.8, 3.8, 3.7, 3.8],
      courseUniversity: this.props.courseUniversity ?? [3.7, 3.7, 3.6, 3.7, 3.7, 3.6, 3.7]
    };
  }
}
</script>
</body>
</html>
