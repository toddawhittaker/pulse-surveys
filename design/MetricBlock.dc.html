<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}</style></helmet>
<div style="font-family:var(--font-mono)">
  <div style="display:grid;grid-template-columns:130px 100px 100px 90px 100px 1fr;gap:var(--space-4);padding:6px 4px;border-bottom:1px solid var(--hairline);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--spruce-60)">
    <span>Task</span><span>Requests</span><span>P95</span><span>Errors</span><span>Spend</span><span>14 days</span>
  </div>
  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
    <div style="display:grid;grid-template-columns:130px 100px 100px 90px 100px 1fr;gap:var(--space-4);align-items:center;padding:9px 4px;border-bottom:1px solid var(--hairline)">
      <span style="font-size:12px;font-weight:500;color:var(--spruce)">{{ r.task }}</span>
      <span style="font-size:12px;color:var(--spruce-60);font-variant-numeric:tabular-nums">{{ r.requests }}</span>
      <span style="font-size:12px;color:var(--spruce-60);font-variant-numeric:tabular-nums">{{ r.p95 }}</span>
      <span style="font-size:12px;font-variant-numeric:tabular-nums;color:{{ r.errColor }}">{{ r.err }}</span>
      <span style="font-size:12px;color:var(--spruce-60);font-variant-numeric:tabular-nums">{{ r.spend }}</span>
      <svg viewBox="0 0 120 24" width="120" height="24" aria-label="{{ r.trendAria }}" style="display:block"><polyline points="{{ r.points }}" style="fill:none;stroke:var(--marigold);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"></polyline></svg>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:260},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{task: string; requests: string; p95: string; err: string; spend: string; trend: number[]; errBreach?: boolean}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rows = this.props.rows ?? [];
    return {
      rows: rows.map((r) => {
        const t = r.trend ?? [];
        const max = Math.max(...t, 1), min = Math.min(...t, 0);
        const pts = t.map((v, i) => (4 + i * (112 / Math.max(t.length - 1, 1))).toFixed(1) + ',' + (20 - (v - min) / Math.max(max - min, 0.001) * 16).toFixed(1)).join(' ');
        return {
          task: r.task, requests: r.requests, p95: r.p95, err: r.err, spend: r.spend,
          errColor: r.errBreach ? 'var(--madder)' : 'var(--spruce-60)',
          points: pts,
          trendAria: r.task + ' request trend over 14 days'
        };
      })
    };
  }
}
</script>
</body>
</html>
