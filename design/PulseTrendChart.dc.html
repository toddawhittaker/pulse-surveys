<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Schibsted+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:var(--chalk);font-family:var(--font-body);color:var(--spruce)}a{color:var(--marigold-deep)}a:hover{color:var(--spruce)}@keyframes ptc-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes ptc-fade{from{opacity:0}to{opacity:1}}</style></helmet>
<figure style="margin:0">
<div style="position:relative;padding:0 0 {{ padB }} 40px" role="img" aria-label="{{ ariaLabel }}">
  <svg viewBox="0 0 708 {{ svgH }}" width="100%" style="display:block;overflow:visible" aria-hidden="true">
    <sc-for list="{{ gridLines }}" as="g" hint-placeholder-count="5">
      <line x1="0" x2="708" y1="{{ g.y }}" y2="{{ g.y }}" style="stroke:var(--hairline);stroke-width:1"></line>
    </sc-for>
    <path d="{{ uniPath }}" style="fill:none;stroke:var(--mist);stroke-opacity:0.5;stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round;animation:ptc-fade 220ms ease-out {{ fadeDelay }} both"></path>
    <path d="{{ benchPath }}" style="fill:none;stroke:var(--mist);stroke-width:1.5;stroke-dasharray:6 5;stroke-linecap:round;animation:ptc-fade 220ms ease-out {{ fadeDelay }} both"></path>
    <path d="{{ sectionPath }}" pathLength="1" style="fill:none;stroke:var(--marigold);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:ptc-draw 600ms ease-out {{ drawDelay }} both"></path>
    <sc-for list="{{ cohortPaths }}" as="cp" hint-placeholder-count="0">
      <path d="{{ cp.d }}" pathLength="1" style="fill:none;stroke:{{ cp.color }};stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:ptc-draw 600ms ease-out {{ drawDelay }} both"></path>
    </sc-for>
  </svg>
  <sc-if value="{{ singleMode }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:calc(40px + {{ dotLeft }});top:{{ dotTop }};width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--marigold);animation:ptc-fade 150ms ease-out {{ dotDelay }} both" aria-hidden="true"></div>
  </sc-if>
  <sc-for list="{{ cohortDots }}" as="cd" hint-placeholder-count="0">
    <div style="position:absolute;left:calc(40px + {{ cd.left }});top:{{ cd.top }};width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:{{ cd.color }};animation:ptc-fade 150ms ease-out {{ dotDelay }} both" aria-hidden="true"></div>
  </sc-for>
  <sc-for list="{{ gridLines }}" as="g" hint-placeholder-count="5">
    <div style="position:absolute;left:0;width:32px;top:{{ g.topPct }};transform:translateY(-50%);text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--spruce-60)" aria-hidden="true">{{ g.label }}</div>
  </sc-for>
  <sc-if value="{{ showTicks }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="12">
      <div style="position:absolute;bottom:0;left:calc(40px + {{ t.leftPct }});transform:translateX(-50%);text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--spruce-60);white-space:nowrap" aria-hidden="true">{{ t.label }}<sc-if value="{{ t.hasSub }}" hint-placeholder-val="{{ false }}"><div style="font-size:10px;color:var(--mist);margin-top:1px">{{ t.sub }}</div></sc-if></div>
    </sc-for>
  </sc-if>
</div>
<sc-if value="{{ showLegend }}" hint-placeholder-val="{{ true }}"><figcaption style="display:flex;gap:var(--space-5);margin-top:var(--space-3);font-family:var(--font-body);font-size:12px;color:var(--spruce-60);align-items:center;flex-wrap:wrap">
  <span style="display:flex;align-items:center;gap:6px"><svg width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="20" y2="4" style="stroke:var(--marigold);stroke-width:2.5;stroke-linecap:round"></line><circle cx="24" cy="4" r="2.5" style="fill:var(--marigold)"></circle></svg>This section</span>
  <sc-if value="{{ showComp }}" hint-placeholder-val="{{ true }}"><span style="display:flex;align-items:center;gap:6px"><svg width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="26" y2="4" style="stroke:var(--mist);stroke-width:1.5;stroke-dasharray:6 5;stroke-linecap:round"></line></svg>{{ compLabel }}</span>
  <span style="display:flex;align-items:center;gap:6px"><svg width="28" height="8" aria-hidden="true"><line x1="2" y1="4" x2="26" y2="4" style="stroke:var(--mist);stroke-opacity:0.5;stroke-width:1.5;stroke-dasharray:2 4;stroke-linecap:round"></line></svg>University</span></sc-if>
</figcaption></sc-if>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:300},&quot;section&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;benchmark&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;university&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;},&quot;totalWeeks&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:20},&quot;comparables&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showTicks&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showLegend&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:210,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:100,&quot;max&quot;:400},&quot;drawDelay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;fadeDelay&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;yMin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;yMax&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;labelMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;week&quot;,&quot;options&quot;:[&quot;week&quot;,&quot;date&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Axis&quot;},&quot;firstSunday&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-09-13&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Axis&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const total = P.totalWeeks ?? 12, yMin = P.yMin ?? 2.5, yMax = P.yMax ?? 4.5;
    const sec = P.section ?? [3.9, 3.8, 3.7, 3.9, 3.7, 3.5, 3.6];
    const ben = P.benchmark ?? [3.9, 3.9, 3.8, 3.9, 3.9, 3.8, 3.9];
    const uni = P.university ?? [3.8, 3.8, 3.7, 3.8, 3.8, 3.7, 3.8];
    const W = 708, H = P.height ?? 210;
    const showTicks = P.showTicks ?? true;
    const tOff = P.termOffset ?? null;
    const cohorts = P.cohorts ?? null;
    const axis = P.axis ?? 'course';
    const padBn = showTicks ? (tOff === null ? 22 : 36) : 6;
    const comp = P.comparables ?? true;
    const d0 = P.drawDelay ?? 0;
    const x = (i) => i * (W / (total - 1));
    const y = (v) => H - 14 - (v - yMin) / (yMax - yMin) * (H - 28);
    const path = (a) => a.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const gridSrc = (yMax - yMin) > 2.5 ? [1, 2, 3, 4, 5] : [2.5, 3, 3.5, 4, 4.5];
    const gridVals = gridSrc.filter((v) => v >= yMin && v <= yMax);
    const tickLabel = (i) => {
      if (axis === 'term') return (i === 0 ? 'TERM ' : '') + String(i + 1).padStart(2, '0');
      if ((P.labelMode ?? 'week') === 'date') {
        const start = new Date((P.firstSunday ?? '2026-09-13') + 'T12:00:00');
        const d = new Date(start.getTime() + i * 7 * 86400000);
        return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
      }
      return (i === 0 ? 'WK ' : '') + String(i + 1).padStart(2, '0');
    };
    return {
      svgH: String(H),
      padB: padBn + 'px',
      showTicks,
      showComp: comp,
      showLegend: P.showLegend ?? (comp && !cohorts),
      singleMode: !cohorts,
      cohortPaths: (cohorts ?? []).map((co) => ({ color: co.color, d: co.values.map((v, i) => (i ? 'L' : 'M') + x(co.startWeek - 1 + i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ') })),
      cohortDots: (cohorts ?? []).map((co) => ({ color: co.color, left: '(100% - 40px) * ' + (x(co.startWeek - 2 + co.values.length) / W).toFixed(4), top: 'calc((100% - ' + padBn + 'px) * ' + (y(co.values[co.values.length - 1]) / H).toFixed(4) + ')' })),
      compLabel: P.compLabel ?? 'Comparable courses',
      drawDelay: d0 + 'ms',
      fadeDelay: (P.fadeDelay ?? 600) + 'ms',
      dotDelay: (d0 + 560) + 'ms',
      sectionPath: cohorts ? '' : path(sec), benchPath: (comp && !cohorts) ? path(ben) : '', uniPath: (comp && !cohorts) ? path(uni) : '',
      dotLeft: '(100% - 40px) * ' + (x(sec.length - 1) / W).toFixed(4),
      dotTop: 'calc((100% - ' + padBn + 'px) * ' + (y(sec[sec.length - 1]) / H).toFixed(4) + ')',
      gridLines: gridVals.map((v) => ({ y: y(v).toFixed(1), topPct: 'calc((100% - ' + padBn + 'px) * ' + (y(v) / H).toFixed(4) + ')', label: v.toFixed(1) })),
      ticks: Array.from({ length: total }, (_, i) => ({ leftPct: '(100% - 40px) * ' + (i / (total - 1)).toFixed(4), label: tickLabel(i), hasSub: tOff !== null, sub: tOff === null ? '' : (i === 0 ? 'TERM ' : '') + String(tOff + i + 1).padStart(2, '0') })),
      ariaLabel: 'Weekly rating trend, week ' + sec.length + ' of ' + total + '. Currently ' + sec[sec.length - 1].toFixed(1) + (comp ? '; comparable courses ' + ben[ben.length - 1].toFixed(1) + '; university ' + uni[uni.length - 1].toFixed(1) : '') + '. Values by week: ' + sec.map((v) => v.toFixed(1)).join(', ') + '.'
    };
  }
}
</script>
</body>
</html>
