<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No stylesheet link and no font link, and since E2-10 the second half of
      that is a decision rather than a deferral. The three faces
      docs/DESIGN_BRIEF.md names are self-hosted: the weights and the latin
      subset are imported from src/main.tsx, so the bundler emits them beside
      the bundle and the browser fetches them from this origin. A <link> to a
      font host would be a third-party request made on a student's behalf from
      inside their institution's page, which is what E0-18 declined to do for
      the server-rendered landings and what ADR 0116 declines here.
      design/tokens.css is still where the families are named.
    -->
    <title>Pulse Surveys</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
