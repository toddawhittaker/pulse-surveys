version: 2

# Dependency versions are pinned and lockfiles are committed (CLAUDE.md), so
# updates arrive as reviewable pull requests rather than as drift. Each one goes
# through the same CI gates and the same branch model as any other change.
updates:
  # ---- Python backend -----------------------------------------------------
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: 'deps(py)'
    groups:
      # Patch and minor bumps arrive as one pull request so review effort goes
      # to the ones that can actually break something.
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Majors for the LTI, database, and AI provider layers land deliberately
      # in their own ticket, not on a Monday morning batch.
      - dependency-name: pylti1p3
        update-types: [version-update:semver-major]
      - dependency-name: sqlalchemy
        update-types: [version-update:semver-major]
      - dependency-name: alembic
        update-types: [version-update:semver-major]

  # ---- Frontend -----------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: 'deps(js)'
    groups:
      js-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  # ---- Container images ---------------------------------------------------
  # Two ecosystems, because they read different files: `docker` reads the
  # `FROM` lines in backend/Dockerfile, `docker-compose` reads the `image:`
  # lines in docker-compose.yml. Every one of those references is pinned by
  # tag *and* by digest (docs/adr/0007-container-images-pinned-by-tag-and-digest.md),
  # which is the form Dependabot updates as a unit — it moves the tag and
  # re-resolves the digest in the same pull request. A bare `postgres:17` would
  # go stale silently instead.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: 'deps(img)'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: 'deps(img)'
    ignore:
      # SPEC §7.1 and §7.2 name these major versions. Moving off one is a spec
      # change and a ticket, not a Monday morning batch.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]

  # ---- GitHub Actions -----------------------------------------------------
  # The only ecosystem with anything to update today. Actions are pinned by
  # major tag in ci.yml; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: 'deps(ci)'
    groups:
      actions:
        patterns: ['*']
