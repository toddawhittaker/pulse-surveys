name: CI

# Runs on every pull request and on pushes to epic branches. `main` needs no
# push trigger of its own: every path to `main` is a pull request, and that
# pull request already ran this pipeline.
on:
  pull_request:
  push:
    branches:
      - 'epic/**'
  # E2-12 scope (b): the eval floors run "on demand via `workflow_dispatch`".
  # Firing them on AI-touching diffs is the right default and is not enough on
  # its own — a provider changes a model behind a stable identifier, a floor
  # needs re-measuring before it is moved, a key is rotated and somebody has to
  # know the wiring still works. None of those is a diff, and without a manual
  # trigger the only way to run the gate would be to push a change to a file
  # that does not need changing.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pinned deliberately (CLAUDE.md — "Pin dependency versions"). Dependabot's
# github-actions and pip ecosystems bump these; nothing here floats.
env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '26'
  RUFF_VERSION: '0.6.9'
  MYPY_VERSION: '1.11.2'
  PIP_AUDIT_VERSION: '2.7.3'
  # 5.5.5 and not 5.0.0: the older release reads only the legacy `License`
  # metadata field, and reported 30 of 77 real dependencies as "unknown
  # license" — including fastapi and pydantic, which declare PEP 639
  # `License-Expression`. An unknown license does not fail the build, so that
  # was a license gate that could not see most of what it was scanning.
  PIP_LICENSES_VERSION: '5.5.5'

jobs:
  # --------------------------------------------------------------------------
  # What exists yet? One probe remains: `node`, which asks whether the root
  # `package.json` exists and gates the Node-side audit and licence steps. Every
  # other tolerance this header once listed is gone — `migrations` and `pytests`
  # with E0-04, the e2e gate with E0-18, the four frontend gates with E1-04, the
  # AI eval floors with E2-12, and the readerless `evals` probe with E2-13. ADR
  # 0002's closing section names the surviving probe and the rule that a new
  # tolerant gate needs its own argued ticket.
  # --------------------------------------------------------------------------
  # E0-38: what *changed*, as against what `detect` below answers, which is what
  # exists. A documentation-only pull request ran pytest against testcontainers,
  # built both images, brought up the Compose stack, ran Playwright, ran the eval
  # floors and audited the supply chain — about fifteen minutes of runner time to
  # establish that no Python changed, on a shape this epic produced six times.
  #
  # **Its own job rather than a fourth output on `detect`**, for two reasons.
  # `detect` answers what exists and this answers what moved, which are different
  # questions with different failure modes; and `detect`'s probe battery in
  # tests/unit/test_the_detect_probes_see_the_files_their_jobs_run.py compares the
  # whole set of outputs that job emits, so an extra one there is a committed
  # E0-36 test turning red for no reason anybody would enjoy diagnosing.
  changed:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      # `true` only when every path the diff touched is documentation nothing
      # depends on. Read by the six expensive gates, which switch their own work
      # off rather than being skipped — the `ci` job's comment says why a
      # job-level `if:` would fail the required check instead.
      inert: ${{ steps.diff.outputs.inert }}
      # `true` when the diff touched anything SPEC §9.3's eval floors measure:
      # the AI package, the eval tree, or either of the two files that carry the
      # model identifier. Read by the `evals` job alone, which is the one gate
      # here that calls a paid provider (E2-12).
      #
      # **Declaring it and never filling it is the quiet failure.** Every reader
      # would hold the empty string, `'' == 'true'` is false, the live eval steps
      # would never run again, and the job would report success — so every route
      # out of the step below emits both classifications rather than one.
      ai_surface: ${{ steps.diff.outputs.ai_surface }}
    steps:
      # Full history, because the step below diffs against the base commit and a
      # shallow clone does not have it. A few seconds here against the fifteen
      # minutes E0-38 measured on a documentation-only run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # **Every failure here emits `inert=false`, which runs everything.** A base
      # commit that is missing, a clone too shallow to hold it, a diff that
      # errors: each means "we do not know what changed", and the only safe
      # reading of that is the full pipeline. `classify_changed_paths.py` takes
      # the same direction for the same reason, an empty path list included.
      #
      # The context values arrive through `env:` rather than being interpolated
      # into the script. They are commit SHAs and an event name, so nothing here
      # is attacker-controlled, but a `${{ }}` expanded inside a `run:` block is
      # the shape of a script-injection finding and there is no reason to write
      # one.
      - id: diff
        name: Classify the changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A push's own range. Not usable for the inert verdict, for the reason
          # the script says below, and exactly right for the AI-surface one.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  $1 = $2"; }

          # "We do not know what changed", said in both classifications at once.
          # Every early exit below is that answer, and each one has to give it
          # twice: the two outputs have opposite polarities — `inert=false` runs
          # the six expensive gates, `ai_surface=true` runs the eval steps — so a
          # route that emitted one and forgot the other would leave the forgotten
          # reader holding the empty string. `'' == 'true'` is false and
          # `'' != 'true'` is true, so forgetting `inert` runs everything and
          # forgetting `ai_surface` silently stops SPEC §9.3's floors ever
          # running again, with the job green. One function rather than two lines
          # repeated at five sites (`docs/MISTAKES.md` entry 13).
          unknown() { emit inert false; emit ai_surface true; }

          # **Only a pull request may be inert.** A push event's base is
          # `github.event.before`, which is the previous head of the branch, so
          # the diff is incremental while the verdict is not. Land a
          # documentation-only merge on an epic branch whose gates last went red
          # and the diff holds only the new commits, everything short-circuits,
          # and the branch badge reports success over code those gates failed on
          # — through this repository's ordinary ticket-merge flow, with nobody
          # doing anything unusual. A pull request is unaffected, because
          # `base.sha` gives the whole delta rather than the last push, which is
          # why the saving this ticket is for is untouched: documentation-only
          # pull requests are the case it was measured on.
          #
          # **That argument is about `inert` and does not carry to `ai_surface`,
          # which is E2-12's security review as a LOW with a bill attached.** Both
          # questions used to leave here together, so every push to an epic branch
          # — every ticket merge in this repository's ordinary flow — ran the full
          # eval suite: about ninety-eight paid provider calls, in the one job
          # holding the provider secret, while this file's own scoping paragraph
          # said live calls happen only when the change touches what §9.3's gate
          # names. The file contradicted itself and the contradiction cost money
          # on every merge.
          #
          # The two questions differ in what an incremental diff can settle. "Is
          # the whole tree inert" is not answerable from the last push; "did this
          # push touch an AI path" is, because a push that touched one anywhere in
          # its own range shows it. So `inert` still leaves here and `ai_surface`
          # goes on to be decided from `before..HEAD`. Every genuine unknown below
          # — no base, a base this clone does not hold, an all-zero `before`, a
          # diff that failed — still answers `true` for it, and those routes were
          # deliberately not narrowed.
          decide_inert=true
          base="${PR_BASE_SHA:-}"
          if [ "${EVENT_NAME:-}" != "pull_request" ]; then
            echo "::notice::${EVENT_NAME:-unknown} is not a pull request, so the diff is"
            echo "::notice::incremental while the inert verdict is not. Every expensive gate runs."
            echo "::notice::The AI-surface question is decided from this push's own range."
            decide_inert=false
            base="${PUSH_BEFORE:-}"
          fi

          # A new branch pushes an all-zero "before", and a missing base is an
          # empty string. Both mean there is nothing to diff against.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::no base commit to diff against; every gate runs."
            unknown
            exit 0
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::base commit ${base} is not in this clone; every gate runs."
            unknown
            exit 0
          fi

          # Redirected to a file and the status checked separately, rather than
          # read through a process substitution: `mapfile` succeeds whether or not
          # `git` did, so reading it that way would turn a failed diff into an
          # empty one (docs/MISTAKES.md entry 34). NUL-delimited because `design/`
          # holds file names with spaces in them, and word-splitting would hand
          # the classifier two paths it has never heard of in place of one it has.
          #
          # **`--no-renames`, and it is load-bearing.** Git detects renames by
          # default and reports a rename as the destination alone, so
          # `git mv backend/app/services/authz.py docs/whatever.md` arrives here
          # as one inert path and the classifier — correctly, about the list it
          # was handed — answers inert. pytest would not run on a change that
          # deleted a service module. The hole is in the path list, not in the
          # classifier. Without rename detection the delete and the add arrive as
          # two paths, the source is outside the inert set, and everything runs.
          # A rename *inside* `docs/mistakes/` still reports two inert paths and
          # stays inert, which is what trimming that directory looks like.
          if ! git diff --no-renames --name-only -z "${base}" HEAD > /tmp/changed-paths.z; then
            echo "::notice::could not diff against ${base}; every gate runs."
            unknown
            exit 0
          fi
          # Also in an `if`, for the reason the classifier invocation below is:
          # a bare command that fails ends the step under `-e`, and the failure
          # mode of this step ending is every gate reporting `skipped` and the
          # required check going red. No bare command is left in it.
          if ! mapfile -t -d '' changed < /tmp/changed-paths.z; then
            echo "::notice::could not read the changed-path list; every gate runs."
            unknown
            exit 0
          fi

          echo "  changed paths (${#changed[@]}):"
          if [ "${#changed[@]}" -gt 0 ]; then
            printf '    %s\n' "${changed[@]}"
          fi

          # `python3`, not `python`: this job deliberately runs no
          # `actions/setup-python`, because the classifier is standard library
          # only and does not need one — and without that action `python` is not
          # on the runner's PATH. Measured by executing this script: it exits 127
          # and the branch below would have emitted `inert=false` forever, so the
          # filter would never once have fired and nothing would have said so.
          #
          # An empty list reaches the classifier as no arguments and it answers
          # not-inert. Deliberate: an empty diff is far more often a broken
          # comparison than an empty change.
          # **In an `if`, not bare.** GitHub runs a `run:` block that declares
          # no `shell:` as `bash -e {0}`, and `set -uo pipefail` above adds two
          # options without clearing the inherited `-e` — only `set +e` would do
          # that, and turning `-e` off wholesale to fix one line is the larger
          # change. Under `-e` a bare command that exits non-zero ends the
          # script, and **exit 1 is this classifier's "not inert" answer**: the
          # ordinary answer for every pull request that touches code. Written
          # bare, this step died before the `case` below could read the status,
          # the job failed, every job needing it reported `skipped`, and E0-36
          # made the aggregate treat `skipped` as failure — so every
          # code-touching pull request failed CI. Measured under `bash -e`.
          # **`--` before the paths, and it is load-bearing.** Without it
          # argparse parses the path list, and it answers before `main` runs, so
          # every fail-closed decision in this script and in that one is
          # downstream of it. A repository root file named `-h` exits 0 — the
          # classifier's "inert" answer — and switches off pytest, the §4.1
          # invariant suite, both image builds, Playwright, the evals and the
          # audit, with the required check green. The class is wider than `-h`:
          # `-hx` is a short-option cluster and `--hel` is an argparse
          # abbreviation, and both exit 0 too. Near misses like `-q` exit 2 and
          # land in the `*)` branch below, which is why nothing caught this.
          # The script rejects leading-dash arguments as well; both halves are
          # deliberate, because the script advertises a general command line.
          # **Asked only when the event can answer it.** A push reached this step
          # with `decide_inert=false` and its verdict settled above, for the
          # reason written there; running the classification anyway and throwing
          # the answer away would leave a log line saying "inert" beside an
          # emitted `false`, which is the kind of disagreement somebody later
          # resolves in the wrong direction.
          if [ "${decide_inert}" = "true" ]; then
            if python3 scripts/ci/classify_changed_paths.py -- "${changed[@]}"; then
              status=0
            else
              status=$?
            fi

            # Its contract is exit 0 for inert and exit 1 for not. Anything else
            # is the classifier failing rather than answering, and that is worth a
            # line in the log: every route out of here still runs every gate, so a
            # broken classifier is invisible in the result and would otherwise
            # look exactly like a repository whose every pull request touches
            # code.
            case "${status}" in
              0) emit inert true ;;
              1) emit inert false ;;
              *)
                echo "::warning::classify_changed_paths.py exited ${status}, which is neither of"
                echo "::warning::its two answers. Every gate runs. This is a broken checker, not a"
                echo "::warning::busy repository."
                emit inert false
                ;;
            esac
          else
            emit inert false
          fi

          # The second question, over the same path list (E2-12). Same script,
          # same `if`, same `--`, same `case`, and every note above applies to it
          # unchanged — including the two that were paid for: `python3` rather
          # than `python`, because this job runs no `actions/setup-python`; and
          # `--` before the paths, because argparse answers before the script's
          # own logic does and a repository file named `-h` would exit 0.
          #
          # **Only the meaning of the exits differs, and it does not.** Exit 0 is
          # "the gates this question decides may short-circuit" for both
          # classifications, which is what lets the two `case` statements be read
          # the same way; here that means "no changed path is an AI surface, so
          # the live eval steps may stay off". A neither-answer exit emits `true`,
          # which runs SPEC §9.3's floors — the direction every failure route in
          # this step takes, because under-firing this gate is the threat and
          # self-harm recall floor not running on the change that most needs it.
          #
          # **This one is asked on a push as well**, unlike the question above,
          # and `${changed[@]}` then holds the push's own range rather than a
          # whole-tree delta. That is the difference the paragraph at the top of
          # this step argues: an incremental diff cannot settle "is everything
          # here documentation" and does settle "did this touch an AI path".
          if python3 scripts/ci/classify_changed_paths.py --classification ai-surface -- "${changed[@]}"; then
            ai_status=0
          else
            ai_status=$?
          fi

          case "${ai_status}" in
            0) emit ai_surface false ;;
            1) emit ai_surface true ;;
            *)
              echo "::warning::classify_changed_paths.py --classification ai-surface exited"
              echo "::warning::${ai_status}, which is neither of its two answers. The eval floors"
              echo "::warning::run. This is a broken checker, not a repository nobody has"
              echo "::warning::touched."
              emit ai_surface true
              ;;
          esac

  detect:
    name: Detect what exists
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
    steps:
      - uses: actions/checkout@v7

      - id: d
        name: Probe the tree
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  $1 = $2"; }

          # Each probe names, as exactly as it can, the thing its job actually
          # runs. A probe that answers false over a tree that has the thing does
          # not skip its gate: the real steps switch themselves off by their own
          # `if:`, the `::notice::` step runs in their place, and **the job
          # reports success**. So a wrong answer here is invisible to the
          # aggregate `ci` check, which sees green rather than skipped.
          #
          # Both of the globs that used to be here were wrong in that direction.
          # `tests/e2e/*.spec.ts` does not descend, so a spec at
          # `tests/e2e/lms/launch.spec.ts` read as no e2e suite at all. And
          # `tests/evals/**/*.py` needs `shopt -s globstar`, which was never set
          # — measured, `globstar` is off in a non-interactive bash — so `**`
          # degraded to a single `*` and the pattern only matched one directory
          # *below* `tests/evals`. `tests/evals/runner.py`, the file
          # `python -m tests.evals.runner` needs, was the one file it could not
          # see, and SPEC §9.3's threat and self-harm recall floor is what the
          # job runs.
          #
          # The third instance, and the first that was live, is E0-40. There is
          # one Node tree in this repository and it is at the root: PR #61
          # committed `package.json`, `package-lock.json`, `playwright.config.ts`
          # and the §9.2 specs there. `npm audit`, the licence scan, `tsc` and
          # `eslint` all asked `frontend/package.json`, which does not exist and
          # is not due until E1, so four gates reported green over a tree they
          # never read. `node` is that question asked honestly: the root
          # manifest, which is where this repository's Node tree is.
          #
          # It gated `tsc` and `eslint` too until E1-04. That ticket lands the
          # application those two check, and ADR 0002 makes removing a tolerance
          # an acceptance criterion of the ticket that lands the code, so they
          # now run unconditionally and this probe gates `npm audit` and the
          # licence scan alone.
          #
          # **There was a `frontend` probe here, and E1-04 withdrew it.** It
          # asked whether `frontend/package.json` declared a `build` script — the
          # narrowing ADR 0083 made when the workspace layout committed that
          # manifest on every branch — and it gated the production build and the
          # bundle budget while both were legitimately waiting for the scaffold.
          # E1-04 lands the scaffold and makes all four frontend gates enforcing,
          # so those two readers stopped reading it. A boolean nothing consults
          # is worse than an unused variable: its wrongness produces no symptom
          # at all, so nobody finds out it is wrong, and the next gate wired to it
          # inherits an answer nothing has ever checked. It goes in the same
          # change as its last reader rather than being left emitting.
          echo "Probing repository layout (SPEC §13):"
          if [ -f package.json ]; then emit node true; else emit node false; fi
          #
          # There is deliberately no `e2e` probe, no `frontend` one and no
          # `evals` one. PR #61 made the Playwright gate unconditional on the
          # specs being present, E1-04 made the four frontend gates enforcing,
          # and E2-12 committed `tests/evals/runner.py` and made the eval job
          # enforcing on the changed-paths classification — so in each case
          # nothing consumed the output any more; a boolean nobody reads is a
          # probe whose wrongness has no symptom, which is the failure this
          # comment's first paragraph is about. E0-40 decision 5 removed the
          # first, E1-04 the second, and E2-13 the third, each in the change
          # that took away its last reader or as soon after as the test wall
          # allowed.

  # ==========================================================================
  # FAST GATES — everything else waits on these.
  # ==========================================================================

  lint-python:
    name: Fast · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned tools
        run: pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Installed from the committed lockfile, hashes and all
      # (docs/adr/0005-dependency-locking.md), then the project itself with no
      # dependency resolution of its own. mypy needs the third-party type
      # information; nothing here may float.
      - name: Install backend and dev dependencies (locked)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # mypy's incremental cache, which is what makes the three runs below cost
      # seconds instead of minutes on a warm runner. All three write to the same
      # `.mypy_cache/` at the repository root, so one entry covers them.
      #
      # The key is the runner OS, the pinned mypy version, and the hash of the
      # dev lockfile: a cache written by a different mypy, or over a different
      # set of installed type stubs, describes types this run does not have. The
      # restore-keys prefix lets a lockfile bump start from the previous
      # closure's cache rather than from nothing — mypy revalidates what it
      # restores, so a stale entry costs time, never correctness. The same
      # revalidation is why three packages all called `app` sharing one cache
      # directory is safe: an entry records the source path it came from, and
      # one written for another `app` is rejected and recomputed. What all three
      # genuinely share is the third-party stub cache, which is the bulk of it.
      - name: Cache mypy's incremental results
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ env.MYPY_VERSION }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ env.MYPY_VERSION }}-

      # mypy runs over backend/, with the strict profile pinned to
      # app/services/ and app/ai/contracts.py in pyproject.toml. Those two are
      # the authorization chokepoint and the AI output contract; they carry the
      # confidentiality and eval guarantees, so they get no untyped escape.
      #
      # Then one invocation per mock, each of which is a further package also
      # called `app` (SPEC §13 names all four). One run over two of them stops
      # with "Duplicate module named app" having checked neither, so this is
      # four runs rather than a longer `files` list. `make typecheck` runs the
      # same four in the same order. See
      # docs/adr/0039-the-two-app-packages-are-typechecked-in-two-runs.md.
      - name: mypy
        run: |
          mypy
          mypy mock-lms/app
          mypy mock-idp/app
          mypy mock-ai/app

      # **Repository-wide sweeps run here because this job is unconditional.**
      # E0-38's inert set says `docs/` is documentation nothing depends on, and
      # that is true of `docs/` as a build *input* — nothing imports, executes,
      # packages or lints it. It is false of `docs/` as a *subject*. These
      # sweeps enumerate the whole repository, so a documentation-only pull
      # request is exactly when they have something new to look at, and leaving
      # them in `Test · pytest + invariants` let the path filter switch off the
      # answer to two incidents that have already happened here:
      #
      #   * conflict markers committed in a Markdown file — docs/MISTAKES.md
      #     entry 21, which happened twice (7f5b300 in PR #24, again in PR #27);
      #   * private key material committed anywhere in the tree, which a docs-only
      #     pull request can carry as easily as a code one — a key pasted into an
      #     ADR is the shape.
      #
      # Both were verified reachable: a tracked `docs/` file holding a conflict
      # marker turns the first red, and `classify_changed_paths.py` calls that
      # same path inert.
      #
      # They stay in tests/unit as well; this runs the same node ids a second
      # time rather than moving them, because they belong to the suite and the
      # suite is where someone looks for them. The duplication is the same shape
      # as `ci-selftest` re-running the classifier battery, and for the same
      # reason: a guard inside a job the classifier can switch off is not a guard.
      # E1-05 adds two entries here, both widenings.
      #
      # The third private-key id is the control one level out. The matcher
      # control above proves that `holds_pem_private_key` reads a header; it
      # says nothing about the *walk*, and the sweep asserts that a walk
      # produced an empty list — which is what a walk that pruned too far
      # produces too (docs/MISTAKES.md entry 35). That control belongs beside
      # the sweep it protects, in the same job, or the protected run is the one
      # without it.
      #
      # The fourth entry is a whole module rather than node ids, and the
      # granularity is deliberate: every test in
      # `test_the_process_wide_authorization_endpoint_is_gone.py` is either the
      # sweep or one of its three controls, so the file is exactly the set that
      # has to travel together, and a control added later comes with it instead
      # of being forgotten here. Its subject is every tracked file, `docs/`
      # included, which is why it is in this job at all.
      #
      # The fifth entry is E1-02's `@types/node` guard, and it is here because
      # the guard that forces this decision said so rather than because anyone
      # noticed. It walks the repository for every `package.json` — the pin may
      # sit in any of them, and E1-04 will move it — and
      # `classify_changed_paths.py` calls `docs/package.json` inert, measured
      # rather than assumed. So a documentation-only pull request can commit a
      # manifest this guard reads, on the one run where it would not have run.
      #
      # The sixth entry is E2-06's one-writer sweep over `survey_window`, and it
      # is a whole module for the same reason the fourth is: every test in
      # `test_survey_windows_have_one_assignment_site.py` is the sweep itself, the
      # control that proves the detector finds each shape it claims to, the
      # positive control that proves it finds the sanctioned writer, or the check
      # that the columns it names are the ones the schema has — and a sweep run
      # without its controls is a silence nobody can read. What puts it in this
      # job is the detector in
      # `test_every_repository_wide_sweep_runs_in_a_job_the_filter_cannot_switch_off`,
      # which reads its `REPO_ROOT`-rooted `rglob` as a repository-wide sweep; the
      # repair that guard asks for is to name the ids here, never to reshape the
      # sweep until the detector stops seeing it.
      #
      # The seventh entry is E3-01's, and it is the case E0-37 item 10 predicted
      # in as many words: a test whose subject is `docs/` itself. It globs
      # `docs/adr` to check that ADR 0082 points at the record which replaced its
      # one-row rule, and every change that could falsify it — editing 0082,
      # deleting 0126 or 0127, renumbering any of them — is a documentation-only
      # diff. Left in the conditional job it would run on every pull request
      # except the ones it exists for. A whole module rather than node ids,
      # because the module is that one sweep.
      - name: Repository-wide sweeps that a docs-only diff must not switch off
        run: |
          pytest -q \
            "tests/unit/test_no_unresolved_merge_conflicts.py::test_the_index_holds_no_conflict_marker" \
            "tests/unit/test_mock_lms_service.py::test_no_private_key_material_is_committed_to_the_repository" \
            "tests/unit/test_mock_lms_service.py::test_the_private_key_matcher_finds_a_private_key_and_ignores_a_public_one" \
            "tests/unit/test_mock_lms_service.py::test_the_sweep_itself_finds_a_planted_key_and_not_a_tree_without_one" \
            "tests/unit/test_the_process_wide_authorization_endpoint_is_gone.py" \
            "tests/unit/test_types_node_tracks_runtime.py" \
            "tests/unit/test_survey_windows_have_one_assignment_site.py" \
            "tests/unit/test_the_signing_key_custody_record_is_amended.py"

  # The job keeps its id and its display name. Branch protection's required-check
  # list keys on the display name, and renaming it is a change to that list
  # rather than to this file — deliberately out of scope for E0-40 (decision 7),
  # so "frontend" in the name below is stale wording and not an oversight.
  #
  # What changed is what it reads. `tsc` and `eslint` ran in `frontend/` on
  # `detect.outputs.frontend`, a directory that does not exist; they now run at
  # the repository root on `playwright.config.ts` and the §9.2 specs, and — from
  # E1-04 — in the frontend workspace on the application.
  #
  # **E1-04 is where this job stopped being tolerant.** It consulted
  # `detect.outputs.node` and printed a notice in place of the work when the
  # answer was no; ADR 0002 makes removing a tolerance an acceptance criterion of
  # the ticket that lands the code, and this is that ticket for `tsc` and
  # `eslint`. The probe is gone from every step here, the notice that stood in
  # for the checkers is gone with it, and there is nothing left to decide: the
  # root manifest is committed and so is the application.
  #
  # The two workspace steps are the other half of the flip and the one that is
  # easy to miss. Since E0-40 these checkers have read `playwright.config.ts` and
  # the §9.2 specs, which was genuinely all the TypeScript this repository held;
  # E1-04 lands several hundred lines more of it in a package with its own
  # `tsconfig.json` and its own eslint configuration, and a gate that went on
  # reading only the root would exit 0 over every line of it — `docs/MISTAKES.md`
  # entry 36 arriving through a workspace boundary instead of through a probe.
  #
  # The job keeps E0-38's documentation-only short-circuit, which is a different
  # clause and stays: a documentation-only diff changes no TypeScript and no
  # manifest, so it is exactly the diff these checkers have nothing to read.
  lint-frontend:
    name: Fast · tsc + eslint
    needs: [changed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation-only diff — nothing was type-checked
        if: needs.changed.outputs.inert == 'true'
        run: |
          echo "::notice::Every changed path is inert documentation (E0-38), so tsc and eslint did not run."
          echo "This job ran and reports success, so the required CI check still sees it."

      - uses: actions/setup-node@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # The one lockfile, at the root, resolving the whole workspace (ADR 0083).
      # It installs the frontend's closure as well as the root's, which is what
      # makes the two workspace steps below possible without a second install.
      - name: Install (lockfile, exact)
        if: needs.changed.outputs.inert != 'true'
        run: npm ci

      - name: tsc --noEmit (root)
        if: needs.changed.outputs.inert != 'true'
        run: npx tsc --noEmit

      - name: eslint (root)
        if: needs.changed.outputs.inert != 'true'
        run: npx eslint . --max-warnings=0

      - name: tsc --noEmit (frontend workspace)
        if: needs.changed.outputs.inert != 'true'
        run: npm run typecheck --workspace frontend

      - name: eslint (frontend workspace)
        if: needs.changed.outputs.inert != 'true'
        run: npm run lint --workspace frontend

  # Enforcing since e0/db-session-alembic (E0-04): `backend/alembic.ini` and the
  # revision chain exist, so this job no longer tolerates their absence.
  #
  # It runs against the role shape a deployment has rather than against a bare
  # superuser cluster, because a drift gate that connects as a role no
  # deployment uses cannot see a grant problem. `services.postgres` has no
  # `/docker-entrypoint-initdb.d`, so the application role is provisioned by a
  # step below, running the same script the Compose stack runs at first start
  # (docs/adr/0009's provisioning table, settled by docs/adr/0012).
  migration-drift:
    name: Fast · migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the `db` service in docker-compose.yml exactly, image
        # reference and all. This job autogenerates migrations against it from
        # E0-04 on, so a Postgres that differs from the deployed one checks the
        # schema against a server the project never runs.
        #
        # Pinned by tag and digest like every other image in the repository
        # (docs/adr/0007). This is the one reference no Dependabot ecosystem
        # reads — `github-actions` updates `uses:` only, and the `docker` and
        # `docker-compose` ecosystems read backend/Dockerfile and
        # docker-compose.yml — so it moves by hand, together with the `db`
        # service, and never on its own. ADR 0007 records that consequence.
        image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: pulse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (locked)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # The same script `/docker-entrypoint-initdb.d` runs on the Compose stack,
      # rather than a second copy of the SQL that could drift from it. It talks
      # to the service container over TCP, so the connection parameters come
      # from PG* variables; everything else it reads is what the `db` service
      # passes it.
      #
      # psql ships in the GitHub runner image. The install line is there so that
      # a runner image which drops it fails with an apt error rather than with
      # "command not found" three steps of debugging later.
      - name: Provision the application role (docs/adr/0009)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: pulse_ci
          DB_APP_USER: pulse_app
          DB_APP_PASSWORD: ci-only-application-role-password
        run: |
          set -euo pipefail
          command -v psql > /dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          ./scripts/db-init/01-application-role.sh

      # `alembic check` autogenerates against the live schema and exits non-zero
      # if the models and the migrations have diverged. A model edited without a
      # migration fails here rather than at deploy time.
      #
      # The three variables are the deployed split, not a convenience: DATABASE_URL
      # names the application role, which cannot create a table, and
      # DB_SUPERUSER/DB_SUPERUSER_PASSWORD are the identity `migrations/env.py`
      # actually connects as (docs/adr/0009, docs/adr/0012). An `env.py` that
      # quietly used DATABASE_URL fails this job on `permission denied for schema
      # public` instead of passing under privileges no deployment grants.
      - name: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://pulse_app:ci-only-application-role-password@localhost:5432/pulse_ci
          DB_SUPERUSER: postgres
          DB_SUPERUSER_PASSWORD: postgres
        run: |
          alembic upgrade head
          alembic check

  # The checkers below decide whether the build may go green, so a bug in one
  # of them fails open and nobody notices. They run before there is a pytest
  # suite to hold them, so they carry their own.
  ci-selftest:
    name: Fast · CI checker self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Self-test the CI checkers
        run: python scripts/ci/test_ci_scripts.py
      # Every shared shell script under scripts/ci/, and the list has to grow with
      # them: a syntax error in one of these is a gate that dies on its first
      # line, and the job that would have found it is this one. `check_job_runtime.sh`
      # and `check_image_contents.sh` both run only inside the `docker` job,
      # which is minutes downstream of here.
      - name: Shell scripts parse
        run: |
          bash -n scripts/ci/wait_for_health.sh
          bash -n scripts/ci/check_job_runtime.sh
          bash -n scripts/ci/check_image_contents.sh

  fast-gate:
    name: Fast gates passed
    needs: [lint-python, lint-frontend, migration-drift, ci-selftest]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint, typecheck, migration drift, and checker self-tests are clean."

  # ==========================================================================
  # TEST GATES
  # ==========================================================================

  # Enforcing since e0/db-session-alembic (E0-04): the suite exists, so this job
  # no longer tolerates its absence. A change that breaks collection now fails
  # this gate instead of switching it off.
  # This job does **not** wait on `fast-gate`. It is the longest job in the
  # pipeline, and holding it behind a three-and-a-half minute lint gate added
  # that gate's duration to every green run's wall clock. Nothing in the steps
  # below reads anything `fast-gate` produces — the only `needs` output any of
  # them consults is `changed.outputs.inert` — so the edge was ordering, not
  # data, and ordering is what cost the time.
  #
  # `fast-gate` is unchanged and still a required leg of the aggregate `ci` job
  # at the bottom of this file, so red lint still fails the pipeline. What is
  # given up is runner minutes: a push with red lint now burns this job too.
  # That is the trade and it is the whole trade — no job-level `if:` is
  # introduced here or anywhere else, because the aggregate treats a skipped
  # job as a failure and every tolerance in this pipeline stays at step level
  # (docs/adr/0002-ci-gates-ship-tolerant.md, and
  # tests/unit/test_the_aggregate_ci_check_sees_an_upstream_failure.py is the
  # regression test).
  test:
    name: Test · pytest + invariants
    needs: [changed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation-only diff — the suite did not run
        if: needs.changed.outputs.inert == 'true'
        run: |
          echo "::notice::Every changed path is inert documentation (E0-38), so the suite did not run."
          echo "This job ran and reports success, so the required CI check still sees it."

      - uses: actions/setup-python@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend + test deps (locked)
        if: needs.changed.outputs.inert != 'true'
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # The invariant suite runs first and alone, so a failure here is
      # unambiguous and cheap. It then runs again inside the full suite; that
      # duplication is deliberate.
      #
      # §4.1 invariants are assertions about what a student can never see. A
      # skipped invariant test is indistinguishable from a deleted one in a
      # green checkmark, so the checker treats skip, xfail, and empty
      # collection as failures — not as skips.
      #
      # `--allow-empty` went with E0-10, which landed the first §4.1
      # invariants. With it, deleting every invariant assertion in the
      # repository was a green pipeline; without it, an empty collection is a
      # build failure. `scripts/ci/check_invariants.py` keeps the flag as an
      # option and nothing passes it.
      # The gate has two halves and they see different things. The first reads
      # the JUnit XML the run above produced, so it catches a skip, an xfail and
      # an empty collection. It cannot see a marked test that ran and asserted
      # nothing — the XML carries no assertion count, so such a test is counted
      # toward the "N invariant test(s) ran" the first one prints. The second
      # reads the sources and refuses exactly that (E0-36 item 3). The Makefile's
      # `invariants` target runs both, in this order.
      - name: Invariant suite (§4.1) — no skips, and no test that asserts nothing
        if: needs.changed.outputs.inert != 'true'
        run: |
          mkdir -p reports
          pytest -m invariant --junitxml=reports/invariants.xml || true
          python scripts/ci/check_invariants.py reports/invariants.xml
          python scripts/ci/check_invariant_assertions.py tests

      # `-n 4` is pytest-xdist: four worker processes over the same collection.
      # This pass is the pipeline's wall clock, and it is the only pass that
      # runs under xdist — the invariant pass above stays serial on purpose
      # (docs/adr/0104-the-unit-and-integration-pass-runs-under-xdist.md, which
      # also records what the four workers cost: each is a full pytest session,
      # so each provisions its own testcontainers Postgres and runs alembic
      # once). `make test` runs the same flag.
      - name: Unit + integration with coverage
        if: needs.changed.outputs.inert != 'true'
        env:
          # testcontainers drives its own Postgres; the runner's Docker daemon
          # is what it talks to.
          TESTCONTAINERS_RYUK_DISABLED: 'false'
        run: |
          pytest tests/unit tests/integration -n 4 \
            --cov=backend/app --cov-report=term-missing --cov-report=xml \
            --junitxml=reports/pytest.xml

      - name: Upload coverage
        if: needs.changed.outputs.inert != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # Enforcing since E0-18: the first §9.2 Playwright specs exist, so this gate
  # runs the suite on every non-inert diff. There is no find-and-skip on the
  # specs any more — an empty `tests/e2e` fails loudly rather than switching the
  # gate off (E0-38's inert-diff skip is the only tolerance left).
  #
  # The `detect` job no longer probes for e2e specs either. It emitted a boolean
  # this job stopped reading when the gate became unconditional, and a probe
  # nothing consults is one whose wrongness has no symptom, so E0-40 decision 5
  # removed the output rather than leaving it to be wired to something later.
  #
  # The stack is brought up here and the database is migrated and seeded
  # host-side, mirroring the `migration-drift` job: the runtime image carries
  # neither `scripts/` nor the migrations, so exec-in-container is not an option,
  # and the override publishes Postgres on localhost:5432 for the host to reach.
  # The seed registers the mock platform in `lti_platform` behind its development
  # guard, and the launch door resolves `iss` against that row — so a launch spec
  # fails without it.
  e2e:
    name: Test · Playwright e2e
    needs: [changed, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inert diff, so the e2e gate did not run
        if: needs.changed.outputs.inert == 'true'
        run: echo "::notice::Every changed path is inert documentation (E0-38), so no e2e path was exercised."

      - uses: actions/setup-node@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The dev closure plus the app itself, from the committed lockfile with
      # hashes — the shape every other Python job here uses. The dev lock rather
      # than the runtime one because `pip install -e . --no-build-isolation`
      # needs the setuptools build backend present, and that ships in the dev
      # extra, not the runtime closure. alembic and the seed's own dependencies
      # are a subset of both.
      - name: Install backend to migrate and seed (locked)
        if: needs.changed.outputs.inert != 'true'
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      - name: Bring up the stack (api, worker, beat, mock-lms, mock-idp, mock-ai)
        if: needs.changed.outputs.inert != 'true'
        run: |
          cp .env.example .env
          docker compose up -d --build
          ./scripts/ci/wait_for_health.sh api worker beat mock-lms mock-idp mock-ai

      # Host-side, against the published port. `.env` supplies the superuser
      # credentials `migrations/env.py` connects as and the ENVIRONMENT the seed
      # requires; only DATABASE_URL's host is rewritten to localhost, the same
      # incantation the README documents for running alembic from the host.
      - name: Migrate and seed the stack's database
        if: needs.changed.outputs.inert != 'true'
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's/@db:/@localhost:/')"
          (cd backend && alembic upgrade head)
          python scripts/seed.py

      - name: Run Playwright
        if: needs.changed.outputs.inert != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Compose logs on failure
        if: failure() && needs.changed.outputs.inert != 'true'
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v7
        if: failure() && needs.changed.outputs.inert != 'true'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # E2-12 turns this job enforcing, and it is ADR 0002's last tolerance. Until
  # now it printed a `::notice::` saying the first eval set and the floors that
  # gate on it "are E2's, and this job stays tolerant until then", and reported
  # success. That sentence is false in the change that lands the set, and ADR
  # 0002 makes removing a tolerance an acceptance criterion of the ticket that
  # lands the code rather than a tidy-up for later.
  #
  # **This job is the one gate in this pipeline that calls a paid provider**, at
  # about a hundred requests a run, so it is the one gate whose steps are
  # conditioned on more than "was the diff inert". Three clauses, and each is
  # doing separate work:
  #
  #   * `needs.changed.outputs.inert != 'true'` — E0-38's short-circuit, kept and
  #     not replaced. Two committed modules require every expensive gate to keep
  #     it, and one of them reads its operator.
  #   * `needs.changed.outputs.ai_surface == 'true'` — E2-12's clause. SPEC §9.3
  #     scopes the floors to "prompt or model changes"; this is that question
  #     asked of the diff.
  #   * `github.event_name == 'workflow_dispatch'` — the manual run, which fires
  #     the steps whatever the diff says, because a dispatch has no meaningful
  #     diff at all.
  #
  # **The inert clause leads every condition, and that is a real constraint.**
  # `test_a_documentation_only_diff_does_not_run_the_expensive_gates.py` reads
  # the sense of an expensive gate's guard by taking the *first* comparison of a
  # `needs.changed.outputs.*` reference against `'true'`. Leading with
  # `ai_surface == 'true'` hands that reader an `==`, it concludes this gate runs
  # only on documentation, and a correct guard reds a committed module. The
  # boolean is identical either way.
  #
  # **The condition is at step level and must stay there.** E0-36 made the
  # aggregate `ci` check treat `skipped` as a failure, so a job-level `if:` fails
  # the one check branch protection points at on every pull request that does not
  # touch the AI surface.
  evals:
    name: Test · AI eval floors
    needs: [changed, detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inert diff, so the eval floors did not run
        if: needs.changed.outputs.inert == 'true'
        run: echo "::notice::Every changed path is inert documentation (E0-38), so no eval floor was checked."

      # The not-fired case, which is an ordinary and expected outcome rather than
      # a tolerance: most pull requests here change no prompt and no model, and
      # SPEC §9.3's gate is scoped to the ones that do.
      #
      # **This script deliberately does not use the word the sibling guard reads.**
      # `test_a_documentation_only_diff_does_not_run_the_expensive_gates.py` flags
      # any step that is switched off by an inert diff, prints a `::notice::`,
      # explains the *inert* classification and does not run the gate's command —
      # it reads that shape as a skip-notice guarded backwards. A notice about the
      # AI-surface classification is a different notice, and saying so plainly is
      # what keeps the two apart.
      - name: This diff touches no AI surface, so the eval floors did not run
        if: needs.changed.outputs.inert != 'true' && needs.changed.outputs.ai_surface != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "::notice::No changed path is under backend/app/ai/ or the eval tree, and neither backend/app/config.py nor .env.example changed, so SPEC §9.3's floors measured nothing. This is the scoped behaviour, not a tolerance: the floors call a paid provider about a hundred times a run and §9.3 scopes them to prompt or model changes."
          echo "::notice::To measure them anyway, run this workflow by hand (Actions, Run workflow)."

      - uses: actions/setup-python@v7
        if: needs.changed.outputs.inert != 'true' && (needs.changed.outputs.ai_surface == 'true' || github.event_name == 'workflow_dispatch')
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (locked)
        if: needs.changed.outputs.inert != 'true' && (needs.changed.outputs.ai_surface == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # Per-task precision and recall floors live with the eval sets, not here,
      # so changing a floor is a visible diff in the suite it governs. The
      # threat/self-harm recall floor is the strictest in the suite (§9.3): a
      # false negative there is a student in danger whose comment reached
      # nobody, which is why it is a hard gate and never a warning.
      #
      # **The three environment values, and why one of them is a secret and two
      # are not.** `AI_PROVIDER_API_KEY` is a credential and lives in the
      # repository's secrets; the repository owner created it and gave the
      # written go on 2026-09-02, which is what CLAUDE.md's secrets policy
      # requires before a `secrets.*` expression may appear here — asked, then
      # waited for, never provisional. The base URL and the model name are not
      # credentials: `.env.example` documents both in the open, and putting them
      # here rather than in a secret keeps the log able to say which endpoint and
      # which model a floor was measured against, which is half of what makes one
      # run comparable to the next (ADR 0031).
      #
      # The runner refuses plainly when the key is absent or blank, naming the
      # variable, rather than reporting a pass over a run that reached nothing.
      #
      # **The two open values are kept in step with `.env.example` by hand**, and
      # they name the provider ruled on 2026-09-02. The endpoint has to serve the
      # `json_schema` structured-output mode `app.ai.gateway` asks for; the
      # provider named here before that ruling answered HTTP 400 to it, which is
      # why the switch happened rather than a second output mode being added.
      # ADR 0118's consequences carry the measurement.
      #
      # **The model wants to be pinned to a snapshot, and this one has none.** A
      # floor is a claim about a particular model: ADR 0031 records the provider's
      # own identifier on every classification precisely so that two runs can be
      # told apart, and the same property applies to the thing being measured.
      # The previous model was pinned that way, as `gpt-5-mini-2025-08-07`.
      #
      # `gpt-5.6-luna` publishes no dated build. Checked on 2026-09-02 by listing
      # the provider's models, by retrieving that model, and by reading a
      # completion's envelope — one bare identifier every time, where the previous
      # model's envelope resolved to its snapshot, and no `system_fingerprint`.
      # So the value below is what the provider serves, and the property the pin
      # bought is unavailable rather than traded away: the weights behind this
      # name can move, and a floor breach would then be indistinguishable from a
      # model change with nothing here able to tell. ADR 0120 carries it as a cost
      # of the switch, and `.env.example` says the same beside its own entry.
      #
      # If a dated Luna build appears, pinning it here is the repair — and it is a
      # re-measurement, so it belongs in a pull request whose subject is moving
      # the floors.
      #
      # **Everything below the provider triple is here because `Settings()` is
      # constructed before any of it is read, and the runner reads none of it.**
      # SPEC §6.3's configuration surface is one class validated as a whole at
      # startup, so a process that only wants a model call still has to satisfy
      # the database, Redis, session and identity-provider fields; the alternative
      # is a second configuration path, which dispute E2-12-01's reasoning refuses
      # and which would be a way for a deployment to start without the checks. The
      # nine values are obviously fake, address nothing that exists on a runner,
      # and hold no credential — the eval job starts no services and opens no
      # connection, and none of these is consulted between process start and the
      # provider call. They were not guessed: `Settings()` was constructed under
      # exactly this environment and each one removed in turn, keeping only those
      # whose absence still refuses.
      #
      # **`ENVIRONMENT: development` is load-bearing and does not send the run to
      # the mock.** It is the environment where the identity-provider validators
      # do not fire, which is what lets a loopback authorization endpoint stand in
      # at all — measured, a deployment name refuses `OIDC_AUTHORIZATION_ENDPOINT`
      # outright, because that value is resolved by a browser and loopback there
      # is the reader's own machine (ADR 0077). Which provider the run reaches is
      # a separate question with a separate answer: `AIGateway(live=True)` reads
      # the `AI_PROVIDER_*` triple in *every* environment (ADR 0118), so this says
      # nothing about `mock-ai` and the eval run still measures the real model.
      - name: Eval runner (per-task floors; threat recall is a hard gate)
        if: needs.changed.outputs.inert != 'true' && (needs.changed.outputs.ai_surface == 'true' || github.event_name == 'workflow_dispatch')
        env:
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_PROVIDER_BASE_URL: 'https://api.openai.com/v1'
          AI_PROVIDER_MODEL_NAME: 'gpt-5.6-luna'
          ENVIRONMENT: 'development'
          DATABASE_URL: 'postgresql+psycopg://unused:unused@localhost:5432/unused'
          REDIS_URL: 'redis://localhost:6379/0'
          SESSION_SECRET: 'eval-run-issues-no-sessions'
          INSTITUTION_TIMEZONE: 'America/New_York'
          OIDC_ISSUER: 'http://localhost:8081'
          OIDC_AUTHORIZATION_ENDPOINT: 'http://localhost:8081/oidc/authorize'
          OIDC_TOKEN_ENDPOINT: 'http://localhost:8081/oidc/token'
          OIDC_JWKS_URL: 'http://localhost:8081/oidc/jwks'
          OIDC_CLIENT_ID: 'eval-run-logs-nobody-in'
        run: python -m tests.evals.runner --enforce-floors

  # ==========================================================================
  # BUILD GATES
  # ==========================================================================

  # Enforcing since e0/compose-stack (E0-02): the Compose file and
  # backend/Dockerfile exist, so this job no longer tolerates their absence.
  #
  # The steps after the health wait are the acceptance criteria of E0-02 and
  # E0-03 that no unit test can reach. They live here rather than in pytest
  # because each one needs a running daemon, and because a Compose file can
  # declare all of them correctly and still not work.
  #
  # One step is not an acceptance criterion of either ticket: the base-file-only
  # pass near the end. It covers a gap the others opened rather than a criterion
  # they left, and it says so where it stands.
  docker:
    name: Build · images + Compose health
    needs: [changed, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation-only diff — no image was built
        if: needs.changed.outputs.inert == 'true'
        run: |
          echo "::notice::Every changed path is inert documentation (E0-38), so no image was built."
          echo "This job ran and reports success, so the required CI check still sees it."

      - uses: docker/setup-buildx-action@v4
        if: needs.changed.outputs.inert != 'true'

      - name: Build all images
        if: needs.changed.outputs.inert != 'true'
        run: |
          cp .env.example .env
          docker compose build

      # E0-36 item 4, and it builds an image of its own rather than inspecting
      # the one above — the files it plants have to be in the tree before the
      # build reads the context. In the passing case that build is a cache hit
      # off the one this step follows, because `.dockerignore` excluding the
      # planted files is exactly the condition under which the context has not
      # changed.
      - name: Nothing .dockerignore re-excludes reaches the runtime image
        if: needs.changed.outputs.inert != 'true'
        run: ./scripts/ci/check_image_contents.sh

      # Six services named, eight covered. `api` declares `depends_on` on a
      # healthy `db` and a healthy `redis`, so reaching healthy here means those
      # two did too. `worker`, `beat`, `mock-lms`, `mock-idp` and `mock-ai` have
      # to be named: nothing depends on any of them — the API must come up
      # whether or not the job runtime does, and nothing in the tool depends on
      # any of the three mocks — and a service nobody names is one this gate
      # never looks at.
      - name: Stack comes up healthy (api, worker, beat, mock-lms, mock-idp, mock-ai, and through api db and redis)
        if: needs.changed.outputs.inert != 'true'
        run: |
          docker compose up -d
          ./scripts/ci/wait_for_health.sh api worker beat mock-lms mock-idp mock-ai

      # The container's own HEALTHCHECK proves the app answers itself. It says
      # nothing about whether the development override publishes the port, which
      # is what a developer following the README actually does first.
      # Not `curl --fail`: that fails on 4xx and 5xx, so a redirect satisfies it
      # and the criterion is 200. The code is captured and compared, and it is
      # printed before the comparison so a failure says what was served rather
      # than only that something was wrong.
      - name: Health endpoint answers 200 on the published host port
        if: needs.changed.outputs.inert != 'true'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 10 \
                       --output /dev/null --write-out '%{http_code}' \
                       http://localhost:8000/healthz)"
          echo "GET /healthz -> ${code}"
          test "${code}" = "200"

      # A root runtime user is the first item in E0-02's security review. Asked
      # of the running container rather than read off the Dockerfile, because a
      # `USER` instruction can name a user whose uid is 0.
      - name: API container runs as a non-root user
        if: needs.changed.outputs.inert != 'true'
        run: |
          set -euo pipefail
          uid="$(docker compose exec -T api id -u | tr -d '\r')"
          echo "api runs as uid ${uid}"
          test "${uid}" != "0"

      # E0-03's criteria 2, 3 and 4: the round trip from the API container, beat
      # restarting without losing its schedule file, and the worker health check
      # going red when Redis is taken away. The script is shared with the
      # Makefile — see the comment at the top of it for why these three are not
      # written out here.
      - name: Job runtime (ping round trip, beat restart, worker without Redis)
        if: needs.changed.outputs.inert != 'true'
        run: ./scripts/ci/check_job_runtime.sh

      # The only pass in this pipeline that runs what actually ships, and the
      # reason it exists is not obvious from what it does — so read this before
      # deleting it as a redundant third `up`.
      #
      # `docker compose up` merges docker-compose.override.yml automatically, and
      # that override replaces the installed application with the checkout in all
      # three application containers. Every step above therefore imports from the
      # bind mount, and none of them executes the copy `pip install` put in the
      # image. A stale or missing wheel in `app/jobs` leaves the build, the round
      # trip and every health wait above green, and then fails at worker startup
      # in every deployment. That was reproduced, not assumed; the measurement,
      # the alternatives, and what has to stay true are in
      # docs/adr/0011-ci-validates-the-image-by-running-the-base-compose-file-alone.md.
      #
      # `-f docker-compose.yml` alone: no source mount and no published host
      # port, which is why every check that talks to localhost lives above this
      # step rather than inside it. `down -v` first, so the base file is proved
      # from nothing — beat builds its schedule store on an empty volume here.
      #
      # Every service is named on purpose. `api` reaches `db` and `redis`
      # through its depends_on conditions; nothing depends on `worker`, `beat`,
      # `mock-lms`, `mock-idp` or `mock-ai`, so dropping any of them from this
      # list would leave the pass green against a container that never started.
      - name: Base file alone runs the installed application, not the mounted checkout
        if: needs.changed.outputs.inert != 'true'
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml down -v
          docker compose -f docker-compose.yml up -d
          ./scripts/ci/wait_for_health.sh api worker beat mock-lms mock-idp mock-ai

      # `down -v` discards the Postgres volume and beat's schedule volume, so
      # the second and third starts each initialise from nothing. This catches
      # the class of bug where the stack only comes up on a machine that has run
      # it before.
      - name: Teardown and restart leaves no manual cleanup, twice
        if: needs.changed.outputs.inert != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "::group::down -v && up -d (attempt ${attempt})"
            docker compose down -v
            docker compose up -d
            ./scripts/ci/wait_for_health.sh api worker beat mock-lms mock-idp mock-ai
            echo "::endgroup::"
          done

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  frontend-build:
    name: Build · frontend + bundle budget
    needs: [changed, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The sixth expensive job of the seven, and from E1-04 it is genuinely
      # expensive: an `npm ci`, a production build and a bundle measurement on
      # every pull request that is not documentation-only. It was free while
      # `detect.outputs.frontend` was false, which is why E0-38's security review
      # found it guarded by neither the ticket, the ADR nor the pull request
      # body — all three of which said five expensive jobs.
      #
      # **The probe is gone, and E1-04 is what removed it.** ADR 0002: removing a
      # tolerance is an acceptance criterion of the ticket that lands the
      # corresponding code. The scaffold is committed, so the question that probe
      # asked is answered by the tree on every branch from now on — and a
      # condition that is always true is not harmless, it is a switch nobody is
      # watching whose failure has no symptom.
      #
      # E0-38's documentation-only short-circuit is a different clause and stays.
      - name: Inert diff, so the frontend build did not run
        if: needs.changed.outputs.inert == 'true'
        run: echo "::notice::Every changed path is inert documentation (E0-38), so no frontend bundle was built."

      # The one lockfile, at the root. `frontend/` is a workspace member of the
      # root package (ADR 0083), so it has no lockfile of its own to cache on and
      # no install of its own to run: the root `npm ci` resolves the whole
      # workspace, and `--workspace frontend` picks the script to run out of it.
      # A `cache-dependency-path` naming a file that is not there is not a
      # tolerated miss — setup-node fails the step — so this line moved with the
      # lockfile in the same change (E1-02, acceptance criterion 4).
      - uses: actions/setup-node@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Production build
        if: needs.changed.outputs.inert != 'true'
        run: |
          npm ci
          npm run build --workspace frontend

      # The budget is read from the committed file rather than left to the
      # script's own default: a limit nobody reviewed is a limit nobody can see
      # move. E1-04 re-baselined both numbers against the first real build and
      # `ci/bundle-budget.json` says how they were chosen.
      - name: Bundle budget
        if: needs.changed.outputs.inert != 'true'
        run: python scripts/ci/check_bundle_size.py frontend/dist --budget ci/bundle-budget.json

  # ==========================================================================
  # SUPPLY CHAIN
  # ==========================================================================

  supply-chain:
    name: Supply chain · audit + licenses
    needs: [changed, detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Documentation-only diff — nothing was audited
        if: needs.changed.outputs.inert == 'true'
        run: |
          echo "::notice::Every changed path is inert documentation (E0-38), so nothing was audited."
          echo "This job ran and reports success, so the required CI check still sees it."

      - uses: actions/setup-python@v7
        if: needs.changed.outputs.inert != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned audit tools
        if: needs.changed.outputs.inert != 'true'
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"

      # Audits the lockfiles rather than an installed environment: the locked
      # closure is what deploys, it is hash-pinned so nothing has to be
      # resolved, and the project's own editable install — which is on no
      # advisory feed and which `--strict` would otherwise refuse to skip — is
      # not in the way.
      - name: pip-audit (fail on high/critical)
        if: needs.changed.outputs.inert != 'true'
        run: pip-audit --strict --desc -r requirements.txt -r requirements-dev.txt

      # The Node half runs at the repository root, on `detect.outputs.node`. It
      # asked `detect.outputs.frontend` until E0-40 — a path that does not exist
      # — so `npm audit` and the licence scan reported green having read nothing
      # since PR #61 committed the root manifest. The audit runs clean at the
      # root today; CI simply never called it.
      - uses: actions/setup-node@v7
        if: needs.detect.outputs.node == 'true' && needs.changed.outputs.inert != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for both Node steps below. The licence scanner is a pinned
      # devDependency in this lockfile, not an `npx --yes` fetch resolving latest
      # at run time (CLAUDE.md's pin rule), so its binary has to be on disk
      # before the scan resolves it — and `npm audit` reads the same closure.
      - name: Install the root Node closure (locked)
        if: needs.detect.outputs.node == 'true' && needs.changed.outputs.inert != 'true'
        run: npm ci

      - name: npm audit (fail on high/critical)
        if: needs.detect.outputs.node == 'true' && needs.changed.outputs.inert != 'true'
        run: npm audit --audit-level=high

      # pip-licenses reads installed distributions, so the runtime closure has
      # to be on disk. The runtime lock and not the dev one: test dependencies
      # are not distributed, and §10 is about what we ship. The audit tools
      # installed above are in this environment too, so the scan is a superset
      # of the shipped closure — stricter than §10 asks, deliberately
      # (docs/adr/0005-dependency-locking.md).
      - name: Install the runtime closure to scan (locked)
        if: needs.changed.outputs.inert != 'true'
        run: pip install --require-hashes -r requirements.txt

      # MIT distribution is a spec requirement (§10, "Licensing hygiene"), so a
      # copyleft dependency is a build break rather than a note for later.
      - name: License compatibility (MIT distribution)
        if: needs.changed.outputs.inert != 'true'
        run: |
          mkdir -p reports
          pip-licenses --format=json --with-urls > reports/py-licenses.json
          ARGS="--python-json reports/py-licenses.json"
          if [ "${{ needs.detect.outputs.node }}" = "true" ]; then
            npx license-checker-rseidelsohn --json > reports/npm-licenses.json
            ARGS="$ARGS --npm-json reports/npm-licenses.json"
          fi
          python scripts/ci/check_licenses.py $ARGS

  # --------------------------------------------------------------------------
  # One required check to point branch protection at. Fails if any gate failed,
  # was cancelled, or did not run.
  #
  # `skipped` is in that list, and it is the whole of E0-36 item 1. A job whose
  # dependency failed is reported `skipped` rather than `failure`, so a failure
  # anywhere above `fast-gate` — `migration-drift`, `lint-python`,
  # `lint-frontend`, `ci-selftest`, or `detect` — used to arrive here as a row of
  # skips that `grep -qE 'failure|cancelled'` matched none of. This check then
  # printed "All gates green" and exited 0 over a migration that had drifted from
  # its models, on the one check branch protection points at.
  #
  # The comment this replaces said `skipped` was left out because tolerant jobs
  # report success and so the verdict stayed honest as the tree filled in. The
  # first half is still true and the second no longer follows: every tolerance in
  # this file is at the *step* level, with a `::notice::` step in place of the
  # real work, so no job named below is ever legitimately skipped and a skip here
  # always means something upstream failed. A job-level `if:` on any of them
  # would break that, which is why nothing here has one and why
  # `tests/unit/test_the_aggregate_ci_check_sees_an_upstream_failure.py` fails
  # loudly the moment one appears.
  #
  # **Read the sentence above as narrowly as it is written.** It says a skip
  # among these needs means an upstream failure. It does not say this check sees
  # every way a gate can fail to run, and it must not be read that way, because
  # step-level tolerance is exactly the mechanism by which a job reports
  # *success* over work it did not do: the real steps switch themselves off by
  # their own `if:`, the notice step runs, and the job is green. Nothing is
  # skipped and nothing is red, so this verdict cannot see it and was never going
  # to.
  #
  # That is not hypothetical. E0-36's security review found both `detect` probes
  # answering false over trees that held the thing — `tests/evals/**/*.py`
  # without `globstar`, and a flat-only `tests/e2e/*.spec.ts` — which would have
  # turned off SPEC §9.3's threat and self-harm recall floor with `CI` green.
  # Those two are fixed and `tests/unit/test_the_detect_probes_see_the_files_their_jobs_run.py`
  # holds them, but the shape belongs to the tolerance design rather than to
  # those two globs: what keeps a tolerant job honest is the probe being right,
  # and that is asserted over planted trees, not here.
  # --------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [fast-gate, test, e2e, evals, docker, frontend-build, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled|skipped'; then
            echo "::error::One or more gates failed, was cancelled, or did not run."
            echo "A gate reports 'skipped' when a job it needed did not succeed, so a"
            echo "skip above is an upstream failure — open the job list and find the"
            echo "red one. It will be upstream of the gates listed here."
            exit 1
          fi
          echo "All gates green."
