name: CI

# Runs on every pull request and on pushes to epic branches. `main` needs no
# push trigger of its own: every path to `main` is a pull request, and that
# pull request already ran this pipeline.
on:
  pull_request:
  push:
    branches:
      - 'epic/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pinned deliberately (CLAUDE.md — "Pin dependency versions"). Dependabot's
# github-actions and pip ecosystems bump these; nothing here floats.
env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '20'
  RUFF_VERSION: '0.6.9'
  MYPY_VERSION: '1.11.2'
  PIP_AUDIT_VERSION: '2.7.3'
  # 5.5.5 and not 5.0.0: the older release reads only the legacy `License`
  # metadata field, and reported 30 of 77 real dependencies as "unknown
  # license" — including fastapi and pydantic, which declare PEP 639
  # `License-Expression`. An unknown license does not fail the build, so that
  # was a license gate that could not see most of what it was scanning.
  PIP_LICENSES_VERSION: '5.5.5'

jobs:
  # --------------------------------------------------------------------------
  # What exists yet? Every downstream job is tolerant of a tree that has not
  # been built. As each E0 ticket lands, flip the matching `allow-missing` step
  # in that job from tolerant to enforcing — the job body is already written.
  # --------------------------------------------------------------------------
  detect:
    name: Detect what exists
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.d.outputs.frontend }}
      migrations: ${{ steps.d.outputs.migrations }}
      pytests: ${{ steps.d.outputs.pytests }}
      e2e: ${{ steps.d.outputs.e2e }}
      evals: ${{ steps.d.outputs.evals }}
    steps:
      - uses: actions/checkout@v4

      - id: d
        name: Probe the tree
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "  $1 = $2"; }

          echo "Probing repository layout (SPEC §13):"
          if [ -f frontend/package.json ]; then emit frontend true; else emit frontend false; fi
          if [ -f backend/alembic.ini ]; then emit migrations true; else emit migrations false; fi
          if compgen -G "tests/unit/test_*.py" > /dev/null 2>&1 || compgen -G "tests/integration/test_*.py" > /dev/null 2>&1; then
            emit pytests true
          else
            emit pytests false
          fi
          if compgen -G "tests/e2e/*.spec.ts" > /dev/null 2>&1; then emit e2e true; else emit e2e false; fi
          if [ -d tests/evals ] && compgen -G "tests/evals/**/*.py" > /dev/null 2>&1; then emit evals true; else emit evals false; fi

  # ==========================================================================
  # FAST GATES — everything else waits on these.
  # ==========================================================================

  lint-python:
    name: Fast · ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned tools
        run: pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Installed from the committed lockfile, hashes and all
      # (docs/adr/0005-dependency-locking.md), then the project itself with no
      # dependency resolution of its own. mypy needs the third-party type
      # information; nothing here may float.
      - name: Install backend and dev dependencies (locked)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # mypy runs over backend/, with the strict profile pinned to
      # app/services/ and app/ai/contracts.py in pyproject.toml. Those two are
      # the authorization chokepoint and the AI output contract; they carry the
      # confidentiality and eval guarantees, so they get no untyped escape.
      - name: mypy
        run: mypy

  lint-frontend:
    name: Fast · tsc + eslint
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nothing to check yet
        if: needs.detect.outputs.frontend != 'true'
        run: echo "::notice::No frontend/package.json yet — tsc and eslint have nothing to check. Enforcing once the frontend scaffold lands."

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile, exact)
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: tsc --noEmit
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: eslint
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: npx eslint . --max-warnings=0

  migration-drift:
    name: Fast · migration drift
    needs: detect
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches SPEC §7.2 and the `db` service in docker-compose.yml. This
        # job autogenerates migrations against it from E0-04 on, so a different
        # major version here would check the schema against a Postgres the
        # project never deploys.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: pulse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Nothing to check yet
        if: needs.detect.outputs.migrations != 'true'
        run: echo "::notice::No backend/alembic.ini yet — migration drift has nothing to check. Enforcing once e0/core-schema lands."

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.migrations == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (locked)
        if: needs.detect.outputs.migrations == 'true'
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # `alembic check` autogenerates against the live schema and exits non-zero
      # if the models and the migrations have diverged. A model edited without a
      # migration fails here rather than at deploy time.
      - name: alembic upgrade head && alembic check
        if: needs.detect.outputs.migrations == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pulse_ci
        run: |
          alembic upgrade head
          alembic check

  # The checkers below decide whether the build may go green, so a bug in one
  # of them fails open and nobody notices. They run before there is a pytest
  # suite to hold them, so they carry their own.
  ci-selftest:
    name: Fast · CI checker self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Self-test the CI checkers
        run: python scripts/ci/test_ci_scripts.py
      - name: Shell scripts parse
        run: bash -n scripts/ci/wait_for_health.sh

  fast-gate:
    name: Fast gates passed
    needs: [lint-python, lint-frontend, migration-drift, ci-selftest]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint, typecheck, migration drift, and checker self-tests are clean."

  # ==========================================================================
  # TEST GATES
  # ==========================================================================

  test:
    name: Test · pytest + invariants
    needs: [detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No suite yet
        if: needs.detect.outputs.pytests != 'true'
        run: echo "::notice::No tests/unit or tests/integration yet. Enforcing once the first ticket ships tests (SPEC §14.2 item 1)."

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.pytests == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend + test deps (locked)
        if: needs.detect.outputs.pytests == 'true'
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # The invariant suite runs first and alone, so a failure here is
      # unambiguous and cheap. It then runs again inside the full suite; that
      # duplication is deliberate.
      #
      # §4.1 invariants are assertions about what a student can never see. A
      # skipped invariant test is indistinguishable from a deleted one in a
      # green checkmark, so the checker treats skip, xfail, and empty
      # collection as failures — not as skips.
      - name: Invariant suite (§4.1) — no skips permitted
        if: needs.detect.outputs.pytests == 'true'
        run: |
          mkdir -p reports
          pytest -m invariant --junitxml=reports/invariants.xml || true
          python scripts/ci/check_invariants.py reports/invariants.xml --allow-empty

      - name: Unit + integration with coverage
        if: needs.detect.outputs.pytests == 'true'
        env:
          # testcontainers drives its own Postgres; the runner's Docker daemon
          # is what it talks to.
          TESTCONTAINERS_RYUK_DISABLED: 'false'
        run: |
          pytest tests/unit tests/integration \
            --cov=backend/app --cov-report=term-missing --cov-report=xml \
            --junitxml=reports/pytest.xml

      - name: Upload coverage
        if: needs.detect.outputs.pytests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: Test · Playwright e2e
    needs: [detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No e2e specs yet
        if: needs.detect.outputs.e2e != 'true'
        run: echo "::notice::No tests/e2e specs yet. Enforcing once e0/mock-lms and e0/mock-idp land — §9.2 requires both doors exercised in every run."

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.e2e == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bring up the stack (api, worker, beat, mock-lms, mock-idp)
        if: needs.detect.outputs.e2e == 'true'
        run: |
          cp .env.example .env
          docker compose up -d --build
          ./scripts/ci/wait_for_health.sh api worker beat mock-lms mock-idp

      - name: Run Playwright
        if: needs.detect.outputs.e2e == 'true'
        run: |
          npx --yes playwright install --with-deps chromium
          npx playwright test

      - name: Compose logs on failure
        if: failure() && needs.detect.outputs.e2e == 'true'
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v4
        if: failure() && needs.detect.outputs.e2e == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  evals:
    name: Test · AI eval floors
    needs: [detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No eval sets yet
        if: needs.detect.outputs.evals != 'true'
        run: |
          echo "::notice::No tests/evals runner yet. Enforcing once e0/ai-gateway-shell lands."
          echo "::notice::Running the eval suite needs a provider API key as a repository secret and a secrets.* reference in this workflow. Under the secrets policy in CLAUDE.md that is Todd's call, so it is proposed, not wired."

      - uses: actions/setup-python@v5
        if: needs.detect.outputs.evals == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (locked)
        if: needs.detect.outputs.evals == 'true'
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps --no-build-isolation

      # Per-task precision and recall floors live with the eval sets, not here,
      # so changing a floor is a visible diff in the suite it governs. The
      # threat/self-harm recall floor is the strictest in the suite (§9.3): a
      # false negative there is a student in danger whose comment reached
      # nobody, which is why it is a hard gate and never a warning.
      - name: Eval runner (per-task floors; threat recall is a hard gate)
        if: needs.detect.outputs.evals == 'true'
        run: python -m tests.evals.runner --enforce-floors

  # ==========================================================================
  # BUILD GATES
  # ==========================================================================

  # Enforcing since e0/compose-stack (E0-02): the Compose file and
  # backend/Dockerfile exist, so this job no longer tolerates their absence.
  #
  # The four steps after the health wait are the acceptance criteria of E0-02
  # that no unit test can reach. They live here rather than in pytest because
  # each one needs a running daemon, and because a Compose file can declare all
  # of them correctly and still not work.
  docker:
    name: Build · images + Compose health
    needs: [fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build

      # `wait_for_health.sh api` alone, not api plus its dependencies: `api`
      # declares `depends_on` on a healthy `db` and a healthy `redis`, so
      # reaching healthy here means all three did. `worker` and `beat` join the
      # argument list in E0-03.
      - name: Stack comes up healthy (api, and through it db and redis)
        run: |
          docker compose up -d
          ./scripts/ci/wait_for_health.sh api

      # The container's own HEALTHCHECK proves the app answers itself. It says
      # nothing about whether the development override publishes the port, which
      # is what a developer following the README actually does first.
      # Not `curl --fail`: that fails on 4xx and 5xx, so a redirect satisfies it
      # and the criterion is 200. The code is captured and compared, and it is
      # printed before the comparison so a failure says what was served rather
      # than only that something was wrong.
      - name: Health endpoint answers 200 on the published host port
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 10 \
                       --output /dev/null --write-out '%{http_code}' \
                       http://localhost:8000/healthz)"
          echo "GET /healthz -> ${code}"
          test "${code}" = "200"

      # A root runtime user is the first item in E0-02's security review. Asked
      # of the running container rather than read off the Dockerfile, because a
      # `USER` instruction can name a user whose uid is 0.
      - name: API container runs as a non-root user
        run: |
          set -euo pipefail
          uid="$(docker compose exec -T api id -u | tr -d '\r')"
          echo "api runs as uid ${uid}"
          test "${uid}" != "0"

      # `down -v` discards the Postgres volume, so the second and third starts
      # each initialise a database from nothing. This catches the class of bug
      # where the stack only comes up on a machine that has run it before.
      - name: Teardown and restart leaves no manual cleanup, twice
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "::group::down -v && up -d (attempt ${attempt})"
            docker compose down -v
            docker compose up -d
            ./scripts/ci/wait_for_health.sh api
            echo "::endgroup::"
          done

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  frontend-build:
    name: Build · frontend + bundle budget
    needs: [detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nothing to build yet
        if: needs.detect.outputs.frontend != 'true'
        run: echo "::notice::No frontend/ yet. Enforcing once the frontend scaffold lands."

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Production build
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle budget
        if: needs.detect.outputs.frontend == 'true'
        run: python scripts/ci/check_bundle_size.py frontend/dist --budget ci/bundle-budget.json

  # ==========================================================================
  # SUPPLY CHAIN
  # ==========================================================================

  supply-chain:
    name: Supply chain · audit + licenses
    needs: [detect, fast-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned audit tools
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"

      # Audits the lockfiles rather than an installed environment: the locked
      # closure is what deploys, it is hash-pinned so nothing has to be
      # resolved, and the project's own editable install — which is on no
      # advisory feed and which `--strict` would otherwise refuse to skip — is
      # not in the way.
      - name: pip-audit (fail on high/critical)
        run: pip-audit --strict --desc -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@v4
        if: needs.detect.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (fail on high/critical)
        if: needs.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      # pip-licenses reads installed distributions, so the runtime closure has
      # to be on disk. The runtime lock and not the dev one: test dependencies
      # are not distributed, and §10 is about what we ship. The audit tools
      # installed above are in this environment too, so the scan is a superset
      # of the shipped closure — stricter than §10 asks, deliberately
      # (docs/adr/0005-dependency-locking.md).
      - name: Install the runtime closure to scan (locked)
        run: pip install --require-hashes -r requirements.txt

      # MIT distribution is a spec requirement (§10, "Licensing hygiene"), so a
      # copyleft dependency is a build break rather than a note for later.
      - name: License compatibility (MIT distribution)
        run: |
          mkdir -p reports
          pip-licenses --format=json --with-urls > reports/py-licenses.json
          ARGS="--python-json reports/py-licenses.json"
          if [ "${{ needs.detect.outputs.frontend }}" = "true" ]; then
            (cd frontend && npx --yes license-checker-rseidelsohn@4.3.0 --json > ../reports/npm-licenses.json)
            ARGS="$ARGS --npm-json reports/npm-licenses.json"
          fi
          python scripts/ci/check_licenses.py $ARGS

  # --------------------------------------------------------------------------
  # One required check to point branch protection at. Fails if any gate failed
  # or was cancelled; tolerant jobs report success, so this stays honest as the
  # tree fills in.
  # --------------------------------------------------------------------------
  ci:
    name: CI
    if: always()
    needs: [fast-gate, test, e2e, evals, docker, frontend-build, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more gates failed."
            exit 1
          fi
          echo "All gates green."
