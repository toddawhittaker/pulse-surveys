# Backend package metadata and tooling configuration.
#
# The tool configuration below predates the code it checks: it landed with the
# CI pipeline so that the first backend commit was linted and typechecked on
# arrival rather than retrofitted. The [project] table arrived later, with the
# backend scaffold in E0-01.
#
# Direct dependencies are pinned exactly here; the full transitive closure,
# with hashes, is locked in `requirements.txt` and `requirements-dev.txt`, and
# `make lock` regenerates both. See docs/adr/0005-dependency-locking.md.

[build-system]
# Pinned exactly, like every other dependency. A floating range here is the one
# artifact `--require-hashes` does not reach: under PEP 517 build isolation pip
# fetches the newest matching setuptools from PyPI with no digest to check it
# against, and then runs its build backend in the CI runner. Every site that
# builds this project passes `--no-build-isolation` and uses the hash-locked
# setuptools from `requirements-dev.txt` instead, so this pin and that lock
# entry must move together. See docs/adr/0005-dependency-locking.md.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-surveys"
description = "Weekly course feedback over LTI 1.3, confidential by construction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dynamic = ["version"]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    # The driver `DATABASE_URL` names, `postgresql+psycopg://`. The `binary`
    # extra is what makes it work in the image: the runtime stage is
    # python:3.13-slim with no libpq and no compiler, so the pure-Python
    # distribution would import and then fail to find the library it wraps.
    # `--strip-extras` in `make lock` resolves the extra into an explicit
    # `psycopg-binary` line in both lockfiles, so what ships is still named and
    # hashed. psycopg is LGPL-3.0: the license gate classifies it "review —
    # weak copyleft, linkage matters", which is the right answer for a library
    # imported unmodified from a wheel rather than vendored into our source.
    "psycopg[binary]==3.3.4",
    # Already in the closure under pydantic-settings, and declared here because
    # `backend/migrations/env.py` imports it directly: `alembic` is not started
    # by `Settings`, so it reads `.env` itself, and an import we write is a
    # dependency we declare rather than one we inherit. See docs/adr/0012.
    "python-dotenv==1.2.2",
    "celery==5.6.3",
    "redis==8.1.0",
    "httpx==0.28.1",
    # The IANA database as a package, so `zoneinfo` resolves
    # INSTITUTION_TIMEZONE identically on a developer's machine and in a slim
    # container that ships no system tzdata (§3.1 — windows are timezone-bound).
    "tzdata==2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers==4.15.0",
    "hypothesis==6.165.5",
    # Test-only. `tests/unit/test_compose_stack.py` asserts properties of the
    # Compose files that no running stack can check — chiefly that host port
    # publishing lives in the development override and not in the base file,
    # which `docker compose up` hides by merging the two. Reading the base file
    # on its own is the whole point, so `docker compose config` cannot do this
    # job and a parser is needed. Nothing at runtime imports yaml.
    "PyYAML==6.0.2",
    # Not a test dependency: this is the PEP 517 build backend from
    # `[build-system]` above, listed here so `pip-compile` locks it with a hash
    # and `pip install -e . --no-build-isolation` has a verified copy to build
    # against. It is deliberately absent from the runtime closure, because
    # nothing ships it.
    "setuptools==84.0.0",
]

# ruff, mypy, pip-audit, and pip-licenses are deliberately not listed. They are
# pinned once, in the Makefile and in the `env:` block of
# .github/workflows/ci.yml, because those two run them; a second pin here would
# be a second thing to keep in step.

# `backend/` is the import root: modules are `app.<module>`, never
# `backend.app.<module>`. `mypy_path` below and
# `uvicorn app.main:create_app --factory` both depend on that.
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# The only non-Python files inside the package, and they are not optional: the
# prompt a classification names is the text that produced it (SPEC §7.4). The
# Dockerfile installs a wheel built from this project and nothing else, so
# without this line the runtime image holds `app/ai/contracts.py` and no prompt
# beside it — measured, not assumed: `pip wheel . --no-deps` before this entry
# produced a wheel containing the two `.py` files alone. E0-13 is the first
# caller, and it would fail in the container while passing on a developer's
# machine, where the source tree is still there to read from.
[tool.setuptools.package-data]
"app.ai" = ["prompts/*.md"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["backend/migrations/versions", "design"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowed builtins
    "C4",   # comprehensions
    "DTZ",  # naive datetimes — survey windows are timezone-bound (§3.1)
    "T20",  # no print() in application code
    "SIM",  # simplify
    "PTH",  # pathlib over os.path
    "RUF",
    "S",    # bandit — security
    "ASYNC",
]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # FastAPI Depends() in defaults is the idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is the point
"scripts/**" = ["T20"]       # scripts talk to the operator
"backend/migrations/**" = ["E402", "F401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# `app` is this project's own package, and it lives under `backend/` rather than
# at the repository root — so ruff cannot infer it from the layout for a file
# that is not itself inside the package. Without this, imports of `app.*` are
# sorted into the third-party block in `backend/migrations/env.py` and into the
# first-party block everywhere else, and the difference is invisible until you
# read two files side by side.
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# Strict where the guarantees live. app/services/ holds the authorization
# chokepoint every entry point passes through (CLAUDE.md, SPEC §2.1), and
# ai/contracts.py is simultaneously the runtime contract, the API schema, and
# the eval fixture (§7.4). An untyped escape in either is a confidentiality or
# eval hole, so these get no untyped defs and no implicit Any.
[[tool.mypy.overrides]]
module = ["app.services.*", "app.ai.contracts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
# Async fixtures get a fresh event loop each test. Set explicitly because
# pytest-asyncio warns when it is left implicit, and `filterwarnings` below
# turns that warning into a failure.
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -ra"
markers = [
    # The §4.1 confidentiality assertions. CI runs these in an isolated pass
    # and treats a skip or an xfail as a failure — see
    # scripts/ci/check_invariants.py.
    "invariant: a SPEC §4.1 confidentiality invariant; may never be skipped",
    # Widened in E0-03 from "needs a real Postgres": the Celery round-trip test
    # needs a real broker, and a marker description that named only Postgres
    # would have been a record asserting something the first integration test
    # made false (docs/MISTAKES.md entry 1).
    "integration: needs a real backing service via testcontainers (Postgres, Redis)",
    "lti: exercises signed LTI 1.3 launch fixtures",
    "slow: property-based or generative, measured in tens of seconds",
]
# A deprecated call our own code makes is a defect, so the default is to fail
# on one. The single exemption below is not ours to fix and is not a defect.
#
# celery 5.6.3's Redis result backend stores every task result with
# `pipe.setex(key, expires, value)`. redis-py 8.1.0 marks `setex` deprecated,
# mirroring the Redis *server*, which has preferred `SET key value EX seconds`
# since 2.6.12 — the command still works and celery's call is correct. Under
# `error::DeprecationWarning` that warning is raised inside the worker's task
# trace, so the result is never written and the round-trip test times out
# thirty seconds later with nothing in the failure naming a warning. Measured,
# not guessed: with `WORKER_LOGLEVEL=info` the worker logs
# "Exception raised outside body: DeprecationWarning(...)" and the task itself
# succeeded.
#
# Narrowed to that one message from that one module, so any other deprecated
# call — including a second one from celery — still fails the suite. It goes
# when celery stops calling `setex` or redis-py withdraws the notice; nothing
# in this project calls it.
filterwarnings = [
    "error::DeprecationWarning",
    'ignore:Call to deprecated setex\.:DeprecationWarning:celery.backends.redis',
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/app/main.py", "backend/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
