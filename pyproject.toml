# Tooling configuration only.
#
# The [project] table — name, version, dependencies — lands with the backend
# scaffold in the e0/compose-stack seam. Keeping tool config here now means the
# CI gates and `make ci` are configured before there is code to run them
# against, so the first backend commit is linted and typechecked on arrival
# rather than retrofitted.

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions", "design"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowed builtins
    "C4",   # comprehensions
    "DTZ",  # naive datetimes — survey windows are timezone-bound (§3.1)
    "T20",  # no print() in application code
    "SIM",  # simplify
    "PTH",  # pathlib over os.path
    "RUF",
    "S",    # bandit — security
    "ASYNC",
]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # FastAPI Depends() in defaults is the idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # assert is the point
"scripts/**" = ["T20"]       # scripts talk to the operator
"backend/migrations/**" = ["E402", "F401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# Strict where the guarantees live. app/services/ holds the authorization
# chokepoint every entry point passes through (CLAUDE.md, SPEC §2.1), and
# ai/contracts.py is simultaneously the runtime contract, the API schema, and
# the eval fixture (§7.4). An untyped escape in either is a confidentiality or
# eval hole, so these get no untyped defs and no implicit Any.
[[tool.mypy.overrides]]
module = ["app.services.*", "app.ai.contracts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -ra"
markers = [
    # The §4.1 confidentiality assertions. CI runs these in an isolated pass
    # and treats a skip or an xfail as a failure — see
    # scripts/ci/check_invariants.py.
    "invariant: a SPEC §4.1 confidentiality invariant; may never be skipped",
    "integration: needs a real Postgres via testcontainers",
    "lti: exercises signed LTI 1.3 launch fixtures",
    "slow: property-based or generative, measured in tens of seconds",
]
filterwarnings = ["error::DeprecationWarning"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/app/main.py", "backend/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
